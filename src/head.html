<title>ASD ERP</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,650;12..96,750&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: dark instrument-panel sidebar + light work surface; dense tables, chips encode state */
:root{
  --bg:#f3f6f5; --surface:#ffffff; --surface-2:#eaf0ee; --surface-3:#dfe7e4; --line:#d6dfdc; --line-strong:#b9c6c1;
  --fg:#12201c; --fg-2:#3d4d48; --muted:#62736d;
  --accent:#0a7558; --accent-hover:#08634b; --accent-ink:#ffffff; --accent-soft:#d9efe7; --accent-line:#9fd2c0;
  --side-bg:#0d1b17; --side-bg-2:#14271f; --side-fg:#c9d8d2; --side-muted:#7f958d; --side-active:#1d3a30; --side-accent:#3fd1a0;
  --ok:#17804f; --ok-soft:#dcf1e5; --warn:#a2650a; --warn-soft:#fbeed3; --bad:#c0322a; --bad-soft:#fbe1de; --info:#2a63a8; --info-soft:#dfeaf8; --neutral-soft:#e8ecea;
  --s1:#2a78d6; --s2:#eb6834; --s3:#1baf7a; --s4:#eda100;
  --shadow:0 1px 2px rgba(10,30,25,.06),0 6px 24px rgba(10,30,25,.08);
  --f-display:"Bricolage Grotesque","IBM Plex Sans",system-ui,sans-serif;
  --f-body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,"SFMono-Regular",Menlo,monospace;
  --r:8px; --r-sm:6px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0a110f; --surface:#101a17; --surface-2:#15221e; --surface-3:#1c2c27; --line:#21332d; --line-strong:#2f4740;
  --fg:#e2ece8; --fg-2:#b5c6c0; --muted:#879b94;
  --accent:#34c294; --accent-hover:#4fd3a7; --accent-ink:#04140e; --accent-soft:#12342a; --accent-line:#1f5c49;
  --side-bg:#060c0a; --side-bg-2:#0c1714; --side-fg:#c3d3cd; --side-muted:#6f857d; --side-active:#15302a; --side-accent:#3fd1a0;
  --ok:#3cc283; --ok-soft:#123323; --warn:#e2a23a; --warn-soft:#3a2a10; --bad:#ef6b62; --bad-soft:#3d1916; --info:#6aa6ec; --info-soft:#14263d; --neutral-soft:#1b2723;
  --s1:#3987e5; --s2:#d95926; --s3:#199e70; --s4:#c98500;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 28px rgba(0,0,0,.45);
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0a110f; --surface:#101a17; --surface-2:#15221e; --surface-3:#1c2c27; --line:#21332d; --line-strong:#2f4740;
  --fg:#e2ece8; --fg-2:#b5c6c0; --muted:#879b94;
  --accent:#34c294; --accent-hover:#4fd3a7; --accent-ink:#04140e; --accent-soft:#12342a; --accent-line:#1f5c49;
  --side-bg:#060c0a; --side-bg-2:#0c1714; --side-fg:#c3d3cd; --side-muted:#6f857d; --side-active:#15302a; --side-accent:#3fd1a0;
  --ok:#3cc283; --ok-soft:#123323; --warn:#e2a23a; --warn-soft:#3a2a10; --bad:#ef6b62; --bad-soft:#3d1916; --info:#6aa6ec; --info-soft:#14263d; --neutral-soft:#1b2723;
  --s1:#3987e5; --s2:#d95926; --s3:#199e70; --s4:#c98500;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 28px rgba(0,0,0,.45);
  color-scheme:dark}

*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:14px;line-height:1.45;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:60;background:var(--surface)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.drawer a,.kv a{color:var(--accent);text-decoration:none;font-weight:500}
.drawer a:hover{text-decoration:underline}
.mono{font-family:var(--f-mono);font-size:.92em;letter-spacing:-.01em}
.num{font-variant-numeric:tabular-nums;text-align:right;white-space:nowrap}
.muted{color:var(--muted)}
h1,h2,h3{font-family:var(--f-display);text-wrap:balance;margin:0;letter-spacing:-.01em}

/* ---------- shell ---------- */
.app{display:grid;grid-template-columns:248px minmax(0,1fr);min-height:100%}
.side{background:var(--side-bg);color:var(--side-fg);position:sticky;top:0;height:100vh;display:flex;flex-direction:column;padding-left:env(safe-area-inset-left,0px);z-index:40}
.brand{display:flex;align-items:center;gap:10px;padding:18px 18px 14px}
.brand-mark{width:34px;height:34px;border-radius:9px;background:var(--side-bg-2);display:grid;place-items:center;border:1px solid #23443a}
.brand-name{font-family:var(--f-display);font-weight:750;font-size:20px;color:#fff;letter-spacing:.02em;line-height:1}
.brand-sub{font-size:10.5px;color:var(--side-muted);letter-spacing:.08em;text-transform:uppercase;margin-top:3px}
.nav{flex:1;overflow-y:auto;padding:6px 10px 12px;display:flex;flex-direction:column;gap:1px}
.nav-sec{font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--side-muted);padding:14px 10px 6px}
.nav a{display:flex;align-items:center;gap:11px;padding:8px 10px;border-radius:7px;color:var(--side-fg);text-decoration:none;font-weight:500;font-size:13.5px}
.nav a svg{width:18px;height:18px;flex:none;opacity:.8}
.nav a:hover{background:var(--side-bg-2)}
.nav a.active{background:var(--side-active);color:#fff}
.nav a.active svg{color:var(--side-accent);opacity:1}
.nav .badge{margin-left:auto;font-size:11px;font-family:var(--f-mono);background:#3a1b18;color:#ff9d94;padding:1px 6px;border-radius:10px}
.nav .tag{margin-left:auto;font-size:9.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--side-muted);border:1px solid #2a3f38;border-radius:4px;padding:0 4px}
.side-foot{padding:12px 14px 16px;border-top:1px solid #1b2f28;font-size:12px;color:var(--side-muted)}
.side-foot label{display:block;font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;margin-bottom:5px}
.side-foot select{width:100%;background:var(--side-bg-2);color:var(--side-fg);border:1px solid #23443a;border-radius:6px;padding:7px 8px;color-scheme:dark}

.main{min-width:0;display:flex;flex-direction:column}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;background:color-mix(in srgb,var(--surface) 88%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:12px;padding-block:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.top .crumb{font-size:13px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.top .crumb b{color:var(--fg);font-weight:600}
.search-btn{margin-left:auto;display:flex;align-items:center;gap:8px;min-width:0;width:min(340px,40vw);background:var(--surface-2);border:1px solid var(--line);border-radius:8px;padding:7px 10px;color:var(--muted);text-align:left}
.search-btn span{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kbd{font-family:var(--f-mono);font-size:11px;border:1px solid var(--line-strong);border-radius:4px;padding:0 5px;color:var(--muted)}
.icon-btn{background:transparent;border:1px solid var(--line);border-radius:8px;width:36px;height:36px;display:grid;place-items:center;color:var(--fg-2);flex:none}
.icon-btn:hover{background:var(--surface-2)}
.icon-btn svg{width:18px;height:18px}
.burger{display:none}
.view{padding-block:22px 48px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));max-width:1500px;width:100%;margin:0 auto;min-width:0}
.scrim{display:none}

/* ---------- page header ---------- */
.ph{display:flex;flex-wrap:wrap;align-items:flex-end;gap:14px 24px;margin-bottom:18px}
.ph-txt{min-width:0;flex:1 1 320px}
.eyebrow{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--accent);font-weight:600;margin-bottom:4px}
.ph h1{font-size:28px;font-weight:750;line-height:1.1}
.ph p{margin:6px 0 0;color:var(--muted);max-width:70ch}
.ph-actions{display:flex;gap:8px;flex-wrap:wrap}

/* ---------- KPIs ---------- */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;margin-bottom:18px}
.kpis.six{grid-template-columns:repeat(6,minmax(0,1fr))}
@media (max-width:1380px){.kpis.six{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media (max-width:560px){.kpis.six{grid-template-columns:repeat(2,minmax(0,1fr))}}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;min-width:0}
.kpi .k-l{font-size:12px;color:var(--muted);display:flex;align-items:center;gap:6px}
.kpi .k-v{font-family:var(--f-display);font-weight:650;font-size:24px;margin-top:4px;font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kpi .k-v small{font-size:13px;color:var(--muted);font-weight:500;font-family:var(--f-body)}
.kpi .k-s{font-size:12px;color:var(--muted);margin-top:2px}
.kpi.clickable{cursor:pointer}.kpi.clickable:hover{border-color:var(--accent-line)}
.delta{font-weight:600}.delta.up{color:var(--ok)}.delta.down{color:var(--bad)}
.dot{width:8px;height:8px;border-radius:50%;display:inline-block;flex:none}

/* ---------- tabs ---------- */
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--line);margin-bottom:16px;overflow-x:auto;scrollbar-width:thin}
.tab{background:none;border:0;border-bottom:2px solid transparent;padding:9px 13px;color:var(--muted);font-weight:500;white-space:nowrap;margin-bottom:-1px}
.tab:hover{color:var(--fg)}
.tab.active{color:var(--fg);border-bottom-color:var(--accent)}
.tab .cnt{font-family:var(--f-mono);font-size:11px;color:var(--muted);margin-left:5px}

/* ---------- panels / grid ---------- */
.grid{display:grid;gap:14px}
.g-2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g-3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g-21{grid-template-columns:minmax(0,2fr) minmax(0,1fr)}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;min-width:0}
.panel-h{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin-bottom:12px;flex-wrap:wrap}
.panel-h h3{font-size:15px;font-weight:650}
.panel-h .sub{font-size:12px;color:var(--muted)}
.chart-box{position:relative;height:260px}
.chart-box.sm{height:200px}
.legend{display:flex;flex-wrap:wrap;gap:12px;font-size:12px;color:var(--fg-2);margin-top:8px}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:10px;height:10px;border-radius:3px;display:inline-block}

/* ---------- buttons / inputs ---------- */
.btn{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--line-strong);background:var(--surface);border-radius:7px;padding:7px 12px;font-weight:500;font-size:13px;white-space:nowrap}
.btn:hover{background:var(--surface-2)}
.btn svg{width:15px;height:15px}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{background:var(--accent-hover)}
.btn.ghost{border-color:transparent;background:transparent}
.btn.ghost:hover{background:var(--surface-2)}
.btn.sm{padding:4px 9px;font-size:12px}
.btn.danger{color:var(--bad);border-color:color-mix(in srgb,var(--bad) 40%,transparent)}
.btn.on{background:var(--accent-soft);border-color:var(--accent-line);color:var(--fg)}
.inp,.sel{background:var(--surface);border:1px solid var(--line-strong);border-radius:7px;padding:7px 10px;min-width:0}
.sel{padding-right:6px}
.inp:focus,.sel:focus{outline:2px solid var(--accent);outline-offset:-1px;border-color:transparent}
.field{display:flex;flex-direction:column;gap:5px}
.field label{font-size:12px;color:var(--muted);font-weight:500}
.field .inp,.field .sel{width:100%}

/* ---------- chips / pills ---------- */
.pill{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:500;padding:2px 8px;border-radius:999px;white-space:nowrap;background:var(--neutral-soft);color:var(--fg-2)}
.pill::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor;opacity:.85}
.pill.ok{background:var(--ok-soft);color:var(--ok)}
.pill.warn{background:var(--warn-soft);color:var(--warn)}
.pill.bad{background:var(--bad-soft);color:var(--bad)}
.pill.info{background:var(--info-soft);color:var(--info)}
.pill.acc{background:var(--accent-soft);color:var(--accent)}
.pill.plain::before{display:none}
.circ{font-family:var(--f-mono);font-size:11px;font-weight:500;border-radius:4px;padding:1px 6px;border:1px solid var(--line-strong);color:var(--fg-2);white-space:nowrap}
.circ.A{border-color:var(--accent-line);color:var(--accent);background:var(--accent-soft)}
.circ.B{border-color:color-mix(in srgb,var(--s2) 45%,transparent);color:var(--s2)}

/* ---------- data table ---------- */
.dt{display:flex;flex-direction:column;gap:10px;min-width:0}
.dt-bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.dt-search{position:relative;flex:1 1 240px;min-width:0;max-width:380px}
.dt-search input{width:100%;padding-left:32px}
.dt-search svg{position:absolute;left:10px;top:50%;transform:translateY(-50%);width:15px;height:15px;color:var(--muted)}
.dt-spacer{flex:1}
.facets{display:flex;flex-wrap:wrap;gap:6px 16px;align-items:center}
.facet{display:flex;flex-wrap:wrap;gap:5px;align-items:center}
.facet-l{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin-right:2px}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:3px 10px;font-size:12px;color:var(--fg-2);display:inline-flex;align-items:center;gap:5px}
.chip:hover{border-color:var(--line-strong)}
.chip.on{background:var(--accent-soft);border-color:var(--accent-line);color:var(--fg);font-weight:500}
.chip .c{font-family:var(--f-mono);font-size:10.5px;color:var(--muted)}
.builder{background:var(--surface-2);border:1px solid var(--line);border-radius:var(--r);padding:12px;display:flex;flex-direction:column;gap:8px}
.builder-h{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:13px}
.rule{display:grid;grid-template-columns:minmax(120px,1.1fr) minmax(120px,1fr) minmax(120px,1.4fr) auto;gap:6px;align-items:center}
.rule .vals{display:flex;gap:6px;min-width:0}
.rule .vals .inp,.rule .vals .sel{flex:1;width:100%}
.active-f{display:flex;flex-wrap:wrap;gap:6px;align-items:center;font-size:12px}
.af{display:inline-flex;align-items:center;gap:6px;background:var(--surface);border:1px dashed var(--line-strong);border-radius:6px;padding:2px 4px 2px 8px}
.af button{border:0;background:none;color:var(--muted);padding:0 3px;font-size:15px;line-height:1}
.af button:hover{color:var(--bad)}
.dt-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r);background:var(--surface)}
table.t{width:100%;border-collapse:collapse;font-size:13px}
.t th{position:sticky;top:0;background:var(--surface-2);text-align:left;font-weight:600;font-size:11.5px;letter-spacing:.03em;color:var(--fg-2);padding:9px 12px;border-bottom:1px solid var(--line);white-space:nowrap;user-select:none}
.t th.sortable{cursor:pointer}
.t th.sortable:hover{color:var(--fg)}
.t th .arr{font-size:10px;color:var(--accent);margin-left:3px}
.t td{padding:9px 12px;border-bottom:1px solid var(--line);vertical-align:middle;max-width:340px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.t tbody tr{cursor:pointer}
.t tbody tr:hover td{background:color-mix(in srgb,var(--accent-soft) 45%,transparent)}
.t tbody tr:last-child td{border-bottom:0}
.t tfoot td{background:var(--surface-2);font-weight:600;border-top:1px solid var(--line);border-bottom:0}
.t .r{text-align:right}
.t .strong{font-weight:600}
.empty{padding:40px 16px;text-align:center;color:var(--muted)}
.dt-foot{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;font-size:12.5px;color:var(--muted)}
.pager{display:flex;gap:4px;align-items:center}
.menu{position:relative}
.menu-pop{position:absolute;right:0;top:calc(100% + 4px);background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);padding:6px;min-width:220px;z-index:25;max-height:360px;overflow:auto}
.menu-pop .mi{display:flex;align-items:center;gap:8px;width:100%;text-align:left;border:0;background:none;padding:7px 9px;border-radius:6px;font-size:13px}
.menu-pop .mi:hover{background:var(--surface-2)}
.menu-pop .sep{height:1px;background:var(--line);margin:5px 2px}
.menu-pop .mh{font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);padding:6px 9px 3px}
.bar-cell{display:flex;align-items:center;gap:8px;justify-content:flex-end}
.bar-cell i{display:block;height:6px;border-radius:3px;background:var(--accent);opacity:.75}
.stepper{display:flex;gap:3px;align-items:center}
.stepper i{width:16px;height:5px;border-radius:3px;background:var(--surface-3)}
.stepper i.done{background:var(--accent)}
.stepper i.cancel{background:var(--bad)}

/* ---------- drawer ---------- */
.drawer-scrim{position:fixed;inset:0;background:rgba(5,15,12,.42);z-index:70;opacity:0;pointer-events:none;transition:opacity .18s}
.drawer-scrim.open{opacity:1;pointer-events:auto}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(560px,100%);background:var(--surface);z-index:71;box-shadow:var(--shadow);transform:translateX(102%);transition:transform .22s ease;display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);padding-right:env(safe-area-inset-right,0px)}
.drawer.open{transform:none}
.drawer-h{display:flex;align-items:flex-start;gap:12px;padding:18px 20px 14px;border-bottom:1px solid var(--line)}
.drawer-h h2{font-size:20px;font-weight:700;line-height:1.2}
.drawer-h .eyebrow{margin-bottom:3px}
.drawer-b{flex:1;overflow-y:auto;padding:18px 20px;display:flex;flex-direction:column;gap:18px}
.drawer-f{padding:12px 20px;border-top:1px solid var(--line);display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}
.drawer.wide{width:min(880px,100%)}
.drawer-acts{display:flex;gap:6px;align-items:center;flex:none}
.icon-btn.sm{width:32px;height:32px}.icon-btn.sm svg{width:15px;height:15px}
.icon-btn.del:hover{color:var(--bad);border-color:color-mix(in srgb,var(--bad) 40%,transparent)}
.btn.off,.icon-btn.off{opacity:.45;cursor:not-allowed}
/* actions de ligne, sélection et actions groupées */
.t th.sel-c,.t td.sel-c{width:36px;padding-right:0;cursor:default}
.t td.sel-c input,.t th.sel-c input{width:15px;height:15px;accent-color:var(--accent);cursor:pointer;vertical-align:middle}
.t tbody tr.is-sel td{background:color-mix(in srgb,var(--accent-soft) 70%,transparent)}
.t td.acts,.t th.acts{position:sticky;right:0;background:var(--surface);box-shadow:-1px 0 0 var(--line);overflow:visible}
.t th.acts{background:var(--surface-2);z-index:1}
.t tbody tr:hover td.acts{background:color-mix(in srgb,var(--accent-soft) 45%,var(--surface))}
.t tbody tr.is-sel td.acts{background:color-mix(in srgb,var(--accent-soft) 70%,var(--surface))}
.ra-g{display:inline-flex;gap:2px;margin-left:6px;vertical-align:middle}
.ra{display:inline-grid;place-items:center;width:28px;height:28px;border-radius:6px;border:1px solid transparent;background:transparent;color:var(--muted);flex:none}
.ra:hover{background:var(--surface-2);color:var(--fg);border-color:var(--line)}
.ra.del:hover{color:var(--bad)}
.ra.off{opacity:.3;cursor:not-allowed}
.ra.off:hover{background:transparent;border-color:transparent;color:var(--muted)}
.ra svg{width:15px;height:15px}
.bulk{display:flex;align-items:center;gap:8px;flex-wrap:wrap;background:var(--accent-soft);border:1px solid var(--accent-line);border-radius:var(--r);padding:8px 12px;font-size:13px;margin-bottom:10px}
/* dialogue de confirmation */
.modal-scrim{position:fixed;inset:0;background:rgba(5,15,12,.45);z-index:95;display:grid;place-items:center;padding:16px;animation:tin .15s ease}
.modal{background:var(--surface);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow);width:min(440px,100%);padding:20px;display:flex;flex-direction:column;gap:12px}
.modal h3{font-size:17px;font-weight:700;line-height:1.3}
.modal p{margin:0;color:var(--fg-2);font-size:13.5px;line-height:1.5}
.modal .acts{display:flex;justify-content:flex-end;gap:8px;flex-wrap:wrap;margin-top:4px}
.btn.danger.solid{background:var(--bad);border-color:var(--bad);color:#fff}
.btn.danger.solid:hover{filter:brightness(1.08)}
/* formulaires */
.form-sec{font-size:11.5px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);padding-top:6px;border-top:1px solid var(--line);margin-top:4px}
.field .help{font-size:11.5px;color:var(--muted)}
.lines-w{overflow-x:auto;border:1px solid var(--line);border-radius:8px}
.lines-t{min-width:620px}
.lines-t th{background:var(--surface-2);padding:7px 8px}
.lines-t td{padding:5px 6px;vertical-align:middle}
.lines-t tfoot td{border-bottom:0;padding:8px}
.lines-t .sel{width:100%;min-width:240px;padding:6px 8px}
.lines-t .inp{width:96px;padding:6px 8px;text-align:right}
.lines-t td[data-lt]{white-space:nowrap;font-variant-numeric:tabular-nums}
.add-card{border:1.5px dashed var(--line-strong);border-radius:var(--r);display:grid;place-items:center;min-height:120px;color:var(--muted);background:transparent;font-weight:500;gap:6px}
.add-card:hover{color:var(--accent);border-color:var(--accent);background:var(--accent-soft)}
.card-acts{display:flex;gap:4px;margin-left:8px}
.kv{display:grid;grid-template-columns:minmax(110px,40%) minmax(0,1fr);gap:8px 14px;font-size:13px}
.kv dt{color:var(--muted)}
.kv dd{margin:0;min-width:0;overflow-wrap:anywhere}
.sec-t{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600;margin-bottom:8px}
.mini{width:100%;border-collapse:collapse;font-size:12.5px}
.mini th{text-align:left;color:var(--muted);font-weight:500;padding:5px 6px;border-bottom:1px solid var(--line)}
.mini td{padding:6px;border-bottom:1px solid var(--line)}
.timeline{display:flex;flex-direction:column;gap:12px;border-left:2px solid var(--line);margin-left:6px;padding-left:16px}
.tl-i{position:relative;font-size:13px}
.tl-i::before{content:"";position:absolute;left:-22px;top:5px;width:10px;height:10px;border-radius:50%;background:var(--surface);border:2px solid var(--accent)}
.tl-i .tl-m{font-size:11.5px;color:var(--muted)}
.form-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.form-grid .full{grid-column:1/-1}
.err{color:var(--bad);font-size:12px}
.callout{border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;display:flex;gap:10px;align-items:flex-start;font-size:13px;background:var(--surface-2)}
.callout.ok{background:var(--ok-soft);border-color:transparent}
.callout.bad{background:var(--bad-soft);border-color:transparent}
.callout.warn{background:var(--warn-soft);border-color:transparent}

/* ---------- palette ---------- */
.pal-scrim{position:fixed;inset:0;background:rgba(5,15,12,.45);z-index:80;display:flex;justify-content:center;align-items:flex-start;padding:10vh 16px 16px}
.pal{width:min(620px,100%);background:var(--surface);border-radius:12px;box-shadow:var(--shadow);overflow:hidden;border:1px solid var(--line)}
.pal input{width:100%;border:0;border-bottom:1px solid var(--line);padding:16px 18px;font-size:16px;background:transparent;outline:none}
.pal-list{max-height:52vh;overflow:auto;padding:6px}
.pal-i{display:flex;gap:10px;align-items:center;padding:9px 12px;border-radius:7px;cursor:pointer}
.pal-i.sel,.pal-i:hover{background:var(--accent-soft)}
.pal-i .t1{font-weight:500}
.pal-i .t2{font-size:12px;color:var(--muted)}
.pal-i .ty{margin-left:auto;font-size:11px;color:var(--muted);font-family:var(--f-mono)}

/* ---------- misc views ---------- */
.alerts{display:flex;flex-direction:column;gap:2px}
.al{display:flex;gap:10px;align-items:flex-start;padding:9px 6px;border-bottom:1px solid var(--line);font-size:13px;cursor:pointer;border-radius:6px}
.al:hover{background:var(--surface-2)}
.al:last-child{border-bottom:0}
.al .ic{width:26px;height:26px;border-radius:7px;display:grid;place-items:center;flex:none;font-weight:700;font-size:12px}
.al .ic.bad{background:var(--bad-soft);color:var(--bad)}
.al .ic.warn{background:var(--warn-soft);color:var(--warn)}
.al .ic.info{background:var(--info-soft);color:var(--info)}
.al .m{font-size:12px;color:var(--muted)}
.pipe{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:8px}
.pipe-s{background:var(--surface-2);border-radius:7px;padding:10px;min-width:0;cursor:pointer;border:1px solid transparent}
.pipe-s:hover{border-color:var(--accent-line)}
.pipe-s .n{font-family:var(--f-display);font-size:22px;font-weight:650;font-variant-numeric:tabular-nums}
.pipe-s .l{font-size:11.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pipe-s .b{height:4px;border-radius:2px;background:var(--accent);margin-top:8px}
.toplist{display:flex;flex-direction:column;gap:9px}
.tl-row{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:3px 10px;font-size:13px}
.tl-row .bar{grid-column:1/-1;height:6px;background:var(--surface-2);border-radius:3px;overflow:hidden}
.tl-row .bar i{display:block;height:100%;background:var(--s1);border-radius:3px}
.org{overflow-x:auto;padding:4px 0 10px}
.org ul{list-style:none;margin:0;padding-left:22px;border-left:1px dashed var(--line-strong)}
.org>ul{border-left:0;padding-left:0}
.org li{margin:8px 0;position:relative}
.org ul ul li::before{content:"";position:absolute;left:-22px;top:20px;width:18px;border-top:1px dashed var(--line-strong)}
.org-card{display:inline-flex;gap:10px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:7px 12px;cursor:pointer;min-width:240px}
.org-card:hover{border-color:var(--accent-line)}
.av{width:30px;height:30px;border-radius:50%;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;font-weight:600;font-size:11.5px;flex:none}
.board{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px}
.card-l{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px;display:flex;flex-direction:column;gap:8px}
.stop{display:flex;gap:8px;align-items:flex-start;font-size:12.5px;padding:7px 0;border-top:1px solid var(--line);cursor:pointer}
.stop .seq{font-family:var(--f-mono);font-size:11px;width:20px;height:20px;border-radius:50%;background:var(--surface-2);display:grid;place-items:center;flex:none}
.serial-box{display:flex;gap:8px;flex-wrap:wrap}
.serial-box .inp{flex:1 1 220px}
.toast-w{position:fixed;right:max(16px,env(safe-area-inset-right,0px));bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:90;display:flex;flex-direction:column;gap:8px}
.toast{background:var(--fg);color:var(--bg);padding:10px 14px;border-radius:8px;box-shadow:var(--shadow);font-size:13px;max-width:380px;animation:tin .2s ease;display:flex;align-items:center;gap:14px}
.dw-open .toast-w{right:calc(min(560px,100%) + 16px)}
.dw-open.dw-wide .toast-w{right:calc(min(880px,100%) + 16px)}
@media (max-width:1000px){.dw-open .toast-w,.dw-open.dw-wide .toast-w{right:16px;bottom:auto;top:calc(12px + env(safe-area-inset-top,0px))}}
.toast button{background:transparent;border:0;color:inherit;font-weight:700;text-decoration:underline;padding:0;flex:none;cursor:pointer}
@keyframes tin{from{transform:translateY(8px);opacity:0}}
.seg{display:inline-flex;border:1px solid var(--line-strong);border-radius:7px;overflow:hidden}
.seg button{border:0;background:var(--surface);padding:6px 11px;font-size:12.5px;border-right:1px solid var(--line)}
.seg button:last-child{border-right:0}
.seg button.on{background:var(--accent-soft);font-weight:600}
.filters-row{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:16px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:10px 12px}
.filters-row .fl{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}

@media (max-width:1100px){.g-3{grid-template-columns:repeat(2,minmax(0,1fr))}.pipe{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media (max-width:900px){
  .app{grid-template-columns:minmax(0,1fr)}
  .side{position:fixed;left:0;top:0;bottom:0;width:272px;transform:translateX(-102%);transition:transform .22s ease;padding-top:env(safe-area-inset-top,0px)}
  .app.nav-open .side{transform:none}
  .app.nav-open .scrim{display:block;position:fixed;inset:0;background:rgba(5,15,12,.45);z-index:35}
  .burger{display:grid}
  .g-2,.g-3,.g-21{grid-template-columns:minmax(0,1fr)}
  .search-btn{width:auto;flex:1}
  .search-btn .kbd{display:none}
  .top .crumb{display:none}
}
@media (max-width:560px){
  .ph h1{font-size:23px}
  .rule{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}
  .rule .vals{grid-column:1/-1}
  .form-grid{grid-template-columns:minmax(0,1fr)}
  .pipe{grid-template-columns:repeat(2,minmax(0,1fr))}
  .kpi .k-v{font-size:21px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
