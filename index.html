<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"></head><body>
<title>ASD ERP</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,650;12..96,750&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: dark instrument-panel sidebar + light work surface; dense tables, chips encode state */
:root{
  --bg:#f3f6f5; --surface:#ffffff; --surface-2:#eaf0ee; --surface-3:#dfe7e4; --line:#d6dfdc; --line-strong:#b9c6c1;
  --fg:#12201c; --fg-2:#3d4d48; --muted:#62736d;
  --accent:#0a7558; --accent-hover:#08634b; --accent-ink:#ffffff; --accent-soft:#d9efe7; --accent-line:#9fd2c0;
  --side-bg:#0d1b17; --side-bg-2:#14271f; --side-fg:#c9d8d2; --side-muted:#7f958d; --side-active:#1d3a30; --side-accent:#3fd1a0;
  --ok:#17804f; --ok-soft:#dcf1e5; --warn:#a2650a; --warn-soft:#fbeed3; --bad:#c0322a; --bad-soft:#fbe1de; --info:#2a63a8; --info-soft:#dfeaf8; --neutral-soft:#e8ecea;
  --s1:#2a78d6; --s2:#eb6834; --s3:#1baf7a; --s4:#eda100;
  --shadow:0 1px 2px rgba(10,30,25,.06),0 6px 24px rgba(10,30,25,.08);
  --f-display:"Bricolage Grotesque","IBM Plex Sans",system-ui,sans-serif;
  --f-body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,"SFMono-Regular",Menlo,monospace;
  --r:8px; --r-sm:6px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0a110f; --surface:#101a17; --surface-2:#15221e; --surface-3:#1c2c27; --line:#21332d; --line-strong:#2f4740;
  --fg:#e2ece8; --fg-2:#b5c6c0; --muted:#879b94;
  --accent:#34c294; --accent-hover:#4fd3a7; --accent-ink:#04140e; --accent-soft:#12342a; --accent-line:#1f5c49;
  --side-bg:#060c0a; --side-bg-2:#0c1714; --side-fg:#c3d3cd; --side-muted:#6f857d; --side-active:#15302a; --side-accent:#3fd1a0;
  --ok:#3cc283; --ok-soft:#123323; --warn:#e2a23a; --warn-soft:#3a2a10; --bad:#ef6b62; --bad-soft:#3d1916; --info:#6aa6ec; --info-soft:#14263d; --neutral-soft:#1b2723;
  --s1:#3987e5; --s2:#d95926; --s3:#199e70; --s4:#c98500;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 28px rgba(0,0,0,.45);
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0a110f; --surface:#101a17; --surface-2:#15221e; --surface-3:#1c2c27; --line:#21332d; --line-strong:#2f4740;
  --fg:#e2ece8; --fg-2:#b5c6c0; --muted:#879b94;
  --accent:#34c294; --accent-hover:#4fd3a7; --accent-ink:#04140e; --accent-soft:#12342a; --accent-line:#1f5c49;
  --side-bg:#060c0a; --side-bg-2:#0c1714; --side-fg:#c3d3cd; --side-muted:#6f857d; --side-active:#15302a; --side-accent:#3fd1a0;
  --ok:#3cc283; --ok-soft:#123323; --warn:#e2a23a; --warn-soft:#3a2a10; --bad:#ef6b62; --bad-soft:#3d1916; --info:#6aa6ec; --info-soft:#14263d; --neutral-soft:#1b2723;
  --s1:#3987e5; --s2:#d95926; --s3:#199e70; --s4:#c98500;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 28px rgba(0,0,0,.45);
  color-scheme:dark}

*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:14px;line-height:1.45;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:60;background:var(--surface)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.drawer a,.kv a{color:var(--accent);text-decoration:none;font-weight:500}
.drawer a:hover{text-decoration:underline}
.mono{font-family:var(--f-mono);font-size:.92em;letter-spacing:-.01em}
.num{font-variant-numeric:tabular-nums;text-align:right;white-space:nowrap}
.muted{color:var(--muted)}
h1,h2,h3{font-family:var(--f-display);text-wrap:balance;margin:0;letter-spacing:-.01em}

/* ---------- shell ---------- */
.app{display:grid;grid-template-columns:248px minmax(0,1fr);min-height:100%}
.side{background:var(--side-bg);color:var(--side-fg);position:sticky;top:0;height:100vh;display:flex;flex-direction:column;padding-left:env(safe-area-inset-left,0px);z-index:40}
.brand{display:flex;align-items:center;gap:10px;padding:18px 18px 14px}
.brand-mark{width:34px;height:34px;border-radius:9px;background:var(--side-bg-2);display:grid;place-items:center;border:1px solid #23443a}
.brand-name{font-family:var(--f-display);font-weight:750;font-size:20px;color:#fff;letter-spacing:.02em;line-height:1}
.brand-sub{font-size:10.5px;color:var(--side-muted);letter-spacing:.08em;text-transform:uppercase;margin-top:3px}
.nav{flex:1;overflow-y:auto;padding:6px 10px 12px;display:flex;flex-direction:column;gap:1px}
.nav-sec{font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--side-muted);padding:14px 10px 6px}
.nav a{display:flex;align-items:center;gap:11px;padding:8px 10px;border-radius:7px;color:var(--side-fg);text-decoration:none;font-weight:500;font-size:13.5px}
.nav a svg{width:18px;height:18px;flex:none;opacity:.8}
.nav a:hover{background:var(--side-bg-2)}
.nav a.active{background:var(--side-active);color:#fff}
.nav a.active svg{color:var(--side-accent);opacity:1}
.nav .badge{margin-left:auto;font-size:11px;font-family:var(--f-mono);background:#3a1b18;color:#ff9d94;padding:1px 6px;border-radius:10px}
.nav .tag{margin-left:auto;font-size:9.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--side-muted);border:1px solid #2a3f38;border-radius:4px;padding:0 4px}
.side-foot{padding:12px 14px 16px;border-top:1px solid #1b2f28;font-size:12px;color:var(--side-muted)}
.side-foot label{display:block;font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;margin-bottom:5px}
.side-foot select{width:100%;background:var(--side-bg-2);color:var(--side-fg);border:1px solid #23443a;border-radius:6px;padding:7px 8px;color-scheme:dark}

.main{min-width:0;display:flex;flex-direction:column}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;background:color-mix(in srgb,var(--surface) 88%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:12px;padding-block:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.top .crumb{font-size:13px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.top .crumb b{color:var(--fg);font-weight:600}
.search-btn{margin-left:auto;display:flex;align-items:center;gap:8px;min-width:0;width:min(340px,40vw);background:var(--surface-2);border:1px solid var(--line);border-radius:8px;padding:7px 10px;color:var(--muted);text-align:left}
.search-btn span{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kbd{font-family:var(--f-mono);font-size:11px;border:1px solid var(--line-strong);border-radius:4px;padding:0 5px;color:var(--muted)}
.icon-btn{background:transparent;border:1px solid var(--line);border-radius:8px;width:36px;height:36px;display:grid;place-items:center;color:var(--fg-2);flex:none}
.icon-btn:hover{background:var(--surface-2)}
.icon-btn svg{width:18px;height:18px}
.burger{display:none}
.view{padding-block:22px 48px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));max-width:1500px;width:100%;margin:0 auto;min-width:0}
.scrim{display:none}

/* ---------- page header ---------- */
.ph{display:flex;flex-wrap:wrap;align-items:flex-end;gap:14px 24px;margin-bottom:18px}
.ph-txt{min-width:0;flex:1 1 320px}
.eyebrow{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--accent);font-weight:600;margin-bottom:4px}
.ph h1{font-size:28px;font-weight:750;line-height:1.1}
.ph p{margin:6px 0 0;color:var(--muted);max-width:70ch}
.ph-actions{display:flex;gap:8px;flex-wrap:wrap}

/* ---------- KPIs ---------- */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;margin-bottom:18px}
.kpis.six{grid-template-columns:repeat(6,minmax(0,1fr))}
@media (max-width:1380px){.kpis.six{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media (max-width:560px){.kpis.six{grid-template-columns:repeat(2,minmax(0,1fr))}}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;min-width:0}
.kpi .k-l{font-size:12px;color:var(--muted);display:flex;align-items:center;gap:6px}
.kpi .k-v{font-family:var(--f-display);font-weight:650;font-size:24px;margin-top:4px;font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kpi .k-v small{font-size:13px;color:var(--muted);font-weight:500;font-family:var(--f-body)}
.kpi .k-s{font-size:12px;color:var(--muted);margin-top:2px}
.kpi.clickable{cursor:pointer}.kpi.clickable:hover{border-color:var(--accent-line)}
.delta{font-weight:600}.delta.up{color:var(--ok)}.delta.down{color:var(--bad)}
.dot{width:8px;height:8px;border-radius:50%;display:inline-block;flex:none}

/* ---------- tabs ---------- */
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--line);margin-bottom:16px;overflow-x:auto;scrollbar-width:thin}
.tab{background:none;border:0;border-bottom:2px solid transparent;padding:9px 13px;color:var(--muted);font-weight:500;white-space:nowrap;margin-bottom:-1px}
.tab:hover{color:var(--fg)}
.tab.active{color:var(--fg);border-bottom-color:var(--accent)}
.tab .cnt{font-family:var(--f-mono);font-size:11px;color:var(--muted);margin-left:5px}

/* ---------- panels / grid ---------- */
.grid{display:grid;gap:14px}
.g-2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g-3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g-21{grid-template-columns:minmax(0,2fr) minmax(0,1fr)}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;min-width:0}
.panel-h{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin-bottom:12px;flex-wrap:wrap}
.panel-h h3{font-size:15px;font-weight:650}
.panel-h .sub{font-size:12px;color:var(--muted)}
.chart-box{position:relative;height:260px}
.chart-box.sm{height:200px}
.legend{display:flex;flex-wrap:wrap;gap:12px;font-size:12px;color:var(--fg-2);margin-top:8px}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:10px;height:10px;border-radius:3px;display:inline-block}

/* ---------- buttons / inputs ---------- */
.btn{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--line-strong);background:var(--surface);border-radius:7px;padding:7px 12px;font-weight:500;font-size:13px;white-space:nowrap}
.btn:hover{background:var(--surface-2)}
.btn svg{width:15px;height:15px}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{background:var(--accent-hover)}
.btn.ghost{border-color:transparent;background:transparent}
.btn.ghost:hover{background:var(--surface-2)}
.btn.sm{padding:4px 9px;font-size:12px}
.btn.danger{color:var(--bad);border-color:color-mix(in srgb,var(--bad) 40%,transparent)}
.btn.on{background:var(--accent-soft);border-color:var(--accent-line);color:var(--fg)}
.inp,.sel{background:var(--surface);border:1px solid var(--line-strong);border-radius:7px;padding:7px 10px;min-width:0}
.sel{padding-right:6px}
.inp:focus,.sel:focus{outline:2px solid var(--accent);outline-offset:-1px;border-color:transparent}
.field{display:flex;flex-direction:column;gap:5px}
.field label{font-size:12px;color:var(--muted);font-weight:500}
.field .inp,.field .sel{width:100%}

/* ---------- chips / pills ---------- */
.pill{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:500;padding:2px 8px;border-radius:999px;white-space:nowrap;background:var(--neutral-soft);color:var(--fg-2)}
.pill::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor;opacity:.85}
.pill.ok{background:var(--ok-soft);color:var(--ok)}
.pill.warn{background:var(--warn-soft);color:var(--warn)}
.pill.bad{background:var(--bad-soft);color:var(--bad)}
.pill.info{background:var(--info-soft);color:var(--info)}
.pill.acc{background:var(--accent-soft);color:var(--accent)}
.pill.plain::before{display:none}
.circ{font-family:var(--f-mono);font-size:11px;font-weight:500;border-radius:4px;padding:1px 6px;border:1px solid var(--line-strong);color:var(--fg-2);white-space:nowrap}
.circ.A{border-color:var(--accent-line);color:var(--accent);background:var(--accent-soft)}
.circ.B{border-color:color-mix(in srgb,var(--s2) 45%,transparent);color:var(--s2)}

/* ---------- data table ---------- */
.dt{display:flex;flex-direction:column;gap:10px;min-width:0}
.dt-bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.dt-search{position:relative;flex:1 1 240px;min-width:0;max-width:380px}
.dt-search input{width:100%;padding-left:32px}
.dt-search svg{position:absolute;left:10px;top:50%;transform:translateY(-50%);width:15px;height:15px;color:var(--muted)}
.dt-spacer{flex:1}
.facets{display:flex;flex-wrap:wrap;gap:6px 16px;align-items:center}
.facet{display:flex;flex-wrap:wrap;gap:5px;align-items:center}
.facet-l{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin-right:2px}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:3px 10px;font-size:12px;color:var(--fg-2);display:inline-flex;align-items:center;gap:5px}
.chip:hover{border-color:var(--line-strong)}
.chip.on{background:var(--accent-soft);border-color:var(--accent-line);color:var(--fg);font-weight:500}
.chip .c{font-family:var(--f-mono);font-size:10.5px;color:var(--muted)}
.builder{background:var(--surface-2);border:1px solid var(--line);border-radius:var(--r);padding:12px;display:flex;flex-direction:column;gap:8px}
.builder-h{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:13px}
.rule{display:grid;grid-template-columns:minmax(120px,1.1fr) minmax(120px,1fr) minmax(120px,1.4fr) auto;gap:6px;align-items:center}
.rule .vals{display:flex;gap:6px;min-width:0}
.rule .vals .inp,.rule .vals .sel{flex:1;width:100%}
.active-f{display:flex;flex-wrap:wrap;gap:6px;align-items:center;font-size:12px}
.af{display:inline-flex;align-items:center;gap:6px;background:var(--surface);border:1px dashed var(--line-strong);border-radius:6px;padding:2px 4px 2px 8px}
.af button{border:0;background:none;color:var(--muted);padding:0 3px;font-size:15px;line-height:1}
.af button:hover{color:var(--bad)}
.dt-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r);background:var(--surface)}
table.t{width:100%;border-collapse:collapse;font-size:13px}
.t th{position:sticky;top:0;background:var(--surface-2);text-align:left;font-weight:600;font-size:11.5px;letter-spacing:.03em;color:var(--fg-2);padding:9px 12px;border-bottom:1px solid var(--line);white-space:nowrap;user-select:none}
.t th.sortable{cursor:pointer}
.t th.sortable:hover{color:var(--fg)}
.t th .arr{font-size:10px;color:var(--accent);margin-left:3px}
.t td{padding:9px 12px;border-bottom:1px solid var(--line);vertical-align:middle;max-width:340px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.t tbody tr{cursor:pointer}
.t tbody tr:hover td{background:color-mix(in srgb,var(--accent-soft) 45%,transparent)}
.t tbody tr:last-child td{border-bottom:0}
.t tfoot td{background:var(--surface-2);font-weight:600;border-top:1px solid var(--line);border-bottom:0}
.t .r{text-align:right}
.t .strong{font-weight:600}
.empty{padding:40px 16px;text-align:center;color:var(--muted)}
.dt-foot{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;font-size:12.5px;color:var(--muted)}
.pager{display:flex;gap:4px;align-items:center}
.menu{position:relative}
.menu-pop{position:absolute;right:0;top:calc(100% + 4px);background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);padding:6px;min-width:220px;z-index:25;max-height:360px;overflow:auto}
.menu-pop .mi{display:flex;align-items:center;gap:8px;width:100%;text-align:left;border:0;background:none;padding:7px 9px;border-radius:6px;font-size:13px}
.menu-pop .mi:hover{background:var(--surface-2)}
.menu-pop .sep{height:1px;background:var(--line);margin:5px 2px}
.menu-pop .mh{font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);padding:6px 9px 3px}
.bar-cell{display:flex;align-items:center;gap:8px;justify-content:flex-end}
.bar-cell i{display:block;height:6px;border-radius:3px;background:var(--accent);opacity:.75}
.stepper{display:flex;gap:3px;align-items:center}
.stepper i{width:16px;height:5px;border-radius:3px;background:var(--surface-3)}
.stepper i.done{background:var(--accent)}
.stepper i.cancel{background:var(--bad)}

/* ---------- drawer ---------- */
.drawer-scrim{position:fixed;inset:0;background:rgba(5,15,12,.42);z-index:70;opacity:0;pointer-events:none;transition:opacity .18s}
.drawer-scrim.open{opacity:1;pointer-events:auto}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(560px,100%);background:var(--surface);z-index:71;box-shadow:var(--shadow);transform:translateX(102%);transition:transform .22s ease;display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);padding-right:env(safe-area-inset-right,0px)}
.drawer.open{transform:none}
.drawer-h{display:flex;align-items:flex-start;gap:12px;padding:18px 20px 14px;border-bottom:1px solid var(--line)}
.drawer-h h2{font-size:20px;font-weight:700;line-height:1.2}
.drawer-h .eyebrow{margin-bottom:3px}
.drawer-b{flex:1;overflow-y:auto;padding:18px 20px;display:flex;flex-direction:column;gap:18px}
.drawer-f{padding:12px 20px;border-top:1px solid var(--line);display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}
.kv{display:grid;grid-template-columns:minmax(110px,40%) minmax(0,1fr);gap:8px 14px;font-size:13px}
.kv dt{color:var(--muted)}
.kv dd{margin:0;min-width:0;overflow-wrap:anywhere}
.sec-t{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600;margin-bottom:8px}
.mini{width:100%;border-collapse:collapse;font-size:12.5px}
.mini th{text-align:left;color:var(--muted);font-weight:500;padding:5px 6px;border-bottom:1px solid var(--line)}
.mini td{padding:6px;border-bottom:1px solid var(--line)}
.timeline{display:flex;flex-direction:column;gap:12px;border-left:2px solid var(--line);margin-left:6px;padding-left:16px}
.tl-i{position:relative;font-size:13px}
.tl-i::before{content:"";position:absolute;left:-22px;top:5px;width:10px;height:10px;border-radius:50%;background:var(--surface);border:2px solid var(--accent)}
.tl-i .tl-m{font-size:11.5px;color:var(--muted)}
.form-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.form-grid .full{grid-column:1/-1}
.err{color:var(--bad);font-size:12px}
.callout{border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;display:flex;gap:10px;align-items:flex-start;font-size:13px;background:var(--surface-2)}
.callout.ok{background:var(--ok-soft);border-color:transparent}
.callout.bad{background:var(--bad-soft);border-color:transparent}
.callout.warn{background:var(--warn-soft);border-color:transparent}

/* ---------- palette ---------- */
.pal-scrim{position:fixed;inset:0;background:rgba(5,15,12,.45);z-index:80;display:flex;justify-content:center;align-items:flex-start;padding:10vh 16px 16px}
.pal{width:min(620px,100%);background:var(--surface);border-radius:12px;box-shadow:var(--shadow);overflow:hidden;border:1px solid var(--line)}
.pal input{width:100%;border:0;border-bottom:1px solid var(--line);padding:16px 18px;font-size:16px;background:transparent;outline:none}
.pal-list{max-height:52vh;overflow:auto;padding:6px}
.pal-i{display:flex;gap:10px;align-items:center;padding:9px 12px;border-radius:7px;cursor:pointer}
.pal-i.sel,.pal-i:hover{background:var(--accent-soft)}
.pal-i .t1{font-weight:500}
.pal-i .t2{font-size:12px;color:var(--muted)}
.pal-i .ty{margin-left:auto;font-size:11px;color:var(--muted);font-family:var(--f-mono)}

/* ---------- misc views ---------- */
.alerts{display:flex;flex-direction:column;gap:2px}
.al{display:flex;gap:10px;align-items:flex-start;padding:9px 6px;border-bottom:1px solid var(--line);font-size:13px;cursor:pointer;border-radius:6px}
.al:hover{background:var(--surface-2)}
.al:last-child{border-bottom:0}
.al .ic{width:26px;height:26px;border-radius:7px;display:grid;place-items:center;flex:none;font-weight:700;font-size:12px}
.al .ic.bad{background:var(--bad-soft);color:var(--bad)}
.al .ic.warn{background:var(--warn-soft);color:var(--warn)}
.al .ic.info{background:var(--info-soft);color:var(--info)}
.al .m{font-size:12px;color:var(--muted)}
.pipe{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:8px}
.pipe-s{background:var(--surface-2);border-radius:7px;padding:10px;min-width:0;cursor:pointer;border:1px solid transparent}
.pipe-s:hover{border-color:var(--accent-line)}
.pipe-s .n{font-family:var(--f-display);font-size:22px;font-weight:650;font-variant-numeric:tabular-nums}
.pipe-s .l{font-size:11.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pipe-s .b{height:4px;border-radius:2px;background:var(--accent);margin-top:8px}
.toplist{display:flex;flex-direction:column;gap:9px}
.tl-row{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:3px 10px;font-size:13px}
.tl-row .bar{grid-column:1/-1;height:6px;background:var(--surface-2);border-radius:3px;overflow:hidden}
.tl-row .bar i{display:block;height:100%;background:var(--s1);border-radius:3px}
.org{overflow-x:auto;padding:4px 0 10px}
.org ul{list-style:none;margin:0;padding-left:22px;border-left:1px dashed var(--line-strong)}
.org>ul{border-left:0;padding-left:0}
.org li{margin:8px 0;position:relative}
.org ul ul li::before{content:"";position:absolute;left:-22px;top:20px;width:18px;border-top:1px dashed var(--line-strong)}
.org-card{display:inline-flex;gap:10px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:7px 12px;cursor:pointer;min-width:240px}
.org-card:hover{border-color:var(--accent-line)}
.av{width:30px;height:30px;border-radius:50%;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;font-weight:600;font-size:11.5px;flex:none}
.board{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px}
.card-l{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px;display:flex;flex-direction:column;gap:8px}
.stop{display:flex;gap:8px;align-items:flex-start;font-size:12.5px;padding:7px 0;border-top:1px solid var(--line);cursor:pointer}
.stop .seq{font-family:var(--f-mono);font-size:11px;width:20px;height:20px;border-radius:50%;background:var(--surface-2);display:grid;place-items:center;flex:none}
.serial-box{display:flex;gap:8px;flex-wrap:wrap}
.serial-box .inp{flex:1 1 220px}
.toast-w{position:fixed;right:max(16px,env(safe-area-inset-right,0px));bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:90;display:flex;flex-direction:column;gap:8px}
.toast{background:var(--fg);color:var(--bg);padding:10px 14px;border-radius:8px;box-shadow:var(--shadow);font-size:13px;max-width:340px;animation:tin .2s ease}
@keyframes tin{from{transform:translateY(8px);opacity:0}}
.seg{display:inline-flex;border:1px solid var(--line-strong);border-radius:7px;overflow:hidden}
.seg button{border:0;background:var(--surface);padding:6px 11px;font-size:12.5px;border-right:1px solid var(--line)}
.seg button:last-child{border-right:0}
.seg button.on{background:var(--accent-soft);font-weight:600}
.filters-row{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:16px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:10px 12px}
.filters-row .fl{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}

@media (max-width:1100px){.g-3{grid-template-columns:repeat(2,minmax(0,1fr))}.pipe{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media (max-width:900px){
  .app{grid-template-columns:minmax(0,1fr)}
  .side{position:fixed;left:0;top:0;bottom:0;width:272px;transform:translateX(-102%);transition:transform .22s ease;padding-top:env(safe-area-inset-top,0px)}
  .app.nav-open .side{transform:none}
  .app.nav-open .scrim{display:block;position:fixed;inset:0;background:rgba(5,15,12,.45);z-index:35}
  .burger{display:grid}
  .g-2,.g-3,.g-21{grid-template-columns:minmax(0,1fr)}
  .search-btn{width:auto;flex:1}
  .search-btn .kbd{display:none}
  .top .crumb{display:none}
}
@media (max-width:560px){
  .ph h1{font-size:23px}
  .rule{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}
  .rule .vals{grid-column:1/-1}
  .form-grid{grid-template-columns:minmax(0,1fr)}
  .pipe{grid-template-columns:repeat(2,minmax(0,1fr))}
  .kpi .k-v{font-size:21px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

<script>
/* ================= ASD — données de démonstration (générées une fois, puis mises en cache dans le navigateur) ================= */
const DB_KEY = 'asd.erp.data.v1';
const UI_KEY = 'asd.erp.ui.v1';

function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
const pad2 = n => String(n).padStart(2,'0');
const isoD = d => `${d.getFullYear()}-${pad2(d.getMonth()+1)}-${pad2(d.getDate())}`;
const parseD = s => { const [y,m,d] = s.split('-').map(Number); return new Date(y,m-1,d); };
const addDays = (s,n) => { const d = typeof s==='string'?parseD(s):new Date(s); d.setDate(d.getDate()+n); return isoD(d); };
const addMonths = (s,n) => { const d = parseD(s); d.setMonth(d.getMonth()+n); return isoD(d); };
const daysBetween = (a,b) => Math.round((parseD(b)-parseD(a))/86400000);

const sum0 = (a,f) => a.reduce((s,x)=>s+(f(x)||0),0);
function seedData(){
  const R = mulberry32(20260714);
  const rnd = () => R();
  const ri = (a,b) => Math.floor(rnd()*(b-a+1))+a;
  const pick = a => a[Math.floor(rnd()*a.length)];
  const chance = p => rnd() < p;
  const round = (n,s=10) => Math.round(n/s)*s;
  const now = new Date(); now.setHours(0,0,0,0);
  const TODAY = isoD(now);
  const dayAgo = n => addDays(TODAY,-n);
  let seq = 1; const uid = p => p + (seq++).toString(36).toUpperCase().padStart(5,'0');

  const PRENOMS_H = ['Mohamed','Amine','Yacine','Karim','Sofiane','Rachid','Nabil','Walid','Bilal','Riad','Samir','Mourad','Hichem','Fares','Islam','Ayoub','Abdelkader','Lyes','Nassim','Djamel','Zakaria','Redouane','Omar','Adel'];
  const PRENOMS_F = ['Amina','Sarah','Lina','Imane','Meriem','Yasmine','Nesrine','Lynda','Kahina','Asma','Selma','Rania','Houda','Feriel','Sonia','Khadidja'];
  const NOMS = ['Benali','Bouzid','Haddad','Meziane','Belkacem','Saidi','Khelifi','Boudiaf','Hamidi','Cherif','Djebbar','Rahmani','Mansouri','Ziani','Amrani','Benyahia','Ouali','Taleb','Hadjadji','Brahimi','Lounis','Ait Ahmed','Kaci','Slimani','Bensalem','Ferhat','Zerrouki','Mebarki','Guettaf','Allouache','Bouhired','Messaoudi','Larbi','Touati'];
  const WILAYAS = ['Alger','Oran','Constantine','Sétif','Blida','Annaba','Tizi Ouzou','Béjaïa','Batna','Tlemcen','Boumerdès','Ouargla','Mostaganem','Chlef','Bordj Bou Arréridj','Biskra','Médéa','Djelfa'];
  const WEIGHT_W = [16,10,8,8,7,5,5,5,4,4,4,3,3,3,3,2,2,2];
  const pickW = (arr,w) => { const t=w.reduce((a,b)=>a+b,0); let x=rnd()*t; for(let i=0;i<arr.length;i++){x-=w[i]; if(x<=0) return arr[i];} return arr[0]; };
  const phone = () => `0${pick(['5','6','7'])}${ri(10,99)} ${ri(10,99)} ${ri(10,99)} ${ri(10,99)}`;
  const nif = () => '0'+Array.from({length:14},()=>ri(0,9)).join('');

  /* ---------- Dépôts ---------- */
  const depots = [
    {id:'DEP1',code:'ALG',nom:'Dépôt central Alger',adresse:'Zone industrielle Oued Smar',wilaya:'Alger'},
    {id:'DEP2',code:'ORN',nom:'Dépôt Oran',adresse:'Es Sénia, route de l’aéroport',wilaya:'Oran'},
    {id:'DEP3',code:'CST',nom:'Dépôt Constantine',adresse:'Zone d’activités Zouaghi',wilaya:'Constantine'},
    {id:'DEP4',code:'SET',nom:'Dépôt Sétif',adresse:'Zone industrielle Sétif',wilaya:'Sétif'},
  ];
  const depW = [45,22,18,15];

  /* ---------- Employés ---------- */
  const employes = [];
  const mkEmp = (dep, poste, mgr, opts={}) => {
    const f = chance(.3) && !opts.male;
    const e = {
      id: uid('E'), matricule: 'ASD-' + String(employes.length+101).padStart(4,'0'),
      prenom: f?pick(PRENOMS_F):pick(PRENOMS_H), nom: pick(NOMS), sexe: f?'F':'H',
      poste, departement: dep, managerId: mgr||null,
      dateEmbauche: dayAgo(ri(opts.recent?20:200, opts.recent?260:4200)),
      contrat: 'CDI', finContrat: '', salaire: round(opts.sal || ri(42000,85000),500),
      cnas: String(ri(10,99))+String(ri(1000000,9999999))+String(ri(10,99)),
      tel: phone(), depotId: opts.depot || 'DEP1', soldeConges: ri(2,30), statut:'Actif',
      wilaya: opts.wilaya || 'Alger'
    };
    employes.push(e); return e;
  };
  const dg = mkEmp('Direction','Directeur général',null,{sal:420000,male:true});
  const daf = mkEmp('Direction','Directeur administratif et financier',dg.id,{sal:280000});
  const dcom = mkEmp('Direction','Directeur commercial',dg.id,{sal:260000});
  const dlog = mkEmp('Logistique','Responsable logistique',dg.id,{sal:150000});
  const rsav = mkEmp('Atelier SAV','Responsable SAV',dg.id,{sal:160000});
  const rrh = mkEmp('Ressources humaines','Responsable RH',daf.id,{sal:140000});
  const ccpt = mkEmp('Comptabilité','Chef comptable',daf.id,{sal:150000});
  const rdsi = mkEmp('Informatique','Responsable informatique',daf.id,{sal:145000});
  const commerciaux = [];
  const zones = [['Alger','DEP1'],['Alger','DEP1'],['Blida','DEP1'],['Oran','DEP2'],['Tlemcen','DEP2'],['Constantine','DEP3'],['Annaba','DEP3'],['Sétif','DEP4']];
  zones.forEach(([w,d]) => commerciaux.push(mkEmp('Commercial','Commercial terrain',dcom.id,{sal:ri(65000,95000),wilaya:w,depot:d})));
  mkEmp('Commercial','Assistante commerciale',dcom.id,{sal:58000});
  const livreurs = [];
  for (let i=0;i<6;i++) livreurs.push(mkEmp('Logistique','Livreur',dlog.id,{sal:ri(42000,52000),male:true,depot:depots[i%4].id,wilaya:depots[i%4].wilaya}));
  const magasiniers = depots.map(d => mkEmp('Magasin','Chef magasinier',dlog.id,{sal:ri(55000,70000),depot:d.id,wilaya:d.wilaya}));
  depots.forEach((d,i) => { if(i<3) mkEmp('Magasin','Magasinier',magasiniers[i].id,{sal:ri(42000,50000),depot:d.id,wilaya:d.wilaya}); });
  const techs = [];
  for (let i=0;i<7;i++) techs.push(mkEmp('Atelier SAV',i<2?'Technicien électronique senior':'Technicien électronique',rsav.id,{sal:ri(60000,98000)}));
  mkEmp('Atelier SAV','Agent d’accueil SAV',rsav.id,{sal:46000});
  for (let i=0;i<4;i++) mkEmp('Comptabilité',i===0?'Comptable principal':'Comptable',ccpt.id,{sal:ri(58000,90000)});
  mkEmp('Comptabilité','Caissière',ccpt.id,{sal:48000});
  mkEmp('Ressources humaines','Chargée RH',rrh.id,{sal:62000});
  mkEmp('Ressources humaines','Gestionnaire paie',rrh.id,{sal:66000});
  mkEmp('Informatique','Administrateur systèmes',rdsi.id,{sal:90000});
  // contrats CDD / essai, quelques départs
  employes.forEach((e,i) => {
    if (i<8) return;
    const r = rnd();
    if (r < .22) { e.contrat='CDD'; e.dateEmbauche = dayAgo(ri(60,520)); e.finContrat = addDays(TODAY, ri(-10,200)); }
    else if (r < .30) { e.contrat='Période d’essai'; e.dateEmbauche = dayAgo(ri(10,80)); e.finContrat = addDays(e.dateEmbauche, 90); }
  });
  for (let i=0;i<3;i++){ const e = mkEmp(pick(['Magasin','Commercial','Atelier SAV']), pick(['Magasinier','Commercial terrain','Technicien électronique']), pick([dlog.id,dcom.id,rsav.id])); e.statut='Sorti'; e.dateSortie = dayAgo(ri(20,300)); }

  const conges = [];
  const TYPES_C = ['Congé annuel','Congé annuel','Congé annuel','Maladie','Exceptionnel','Récupération','Sans solde'];
  employes.filter(e=>e.statut==='Actif').forEach(e => {
    const n = ri(0,3);
    for (let k=0;k<n;k++){
      const deb = addDays(TODAY, ri(-300,60)); const j = ri(1,15);
      const st = deb > TODAY ? pick(['En attente','En attente','Approuvé']) : pick(['Approuvé','Approuvé','Approuvé','Refusé']);
      conges.push({id:uid('C'),employeId:e.id,type:pick(TYPES_C),debut:deb,fin:addDays(deb,j-1),jours:j,statut:st,dateDemande:addDays(deb,-ri(3,25)),motif:''});
    }
  });
  const variables = [];
  const months = []; for (let m=11;m>=0;m--){ const d=new Date(now.getFullYear(), now.getMonth()-m, 1); months.push(isoD(d).slice(0,7)); }
  employes.filter(e=>e.statut==='Actif').forEach(e => {
    months.slice(-4).forEach(mo => {
      if (chance(.35)) variables.push({id:uid('V'),employeId:e.id,mois:mo,type:pick(['Prime de rendement','Prime de panier','Prime de transport','Heures supplémentaires']),nature:'Prime',montant:round(ri(3000,25000),500),motif:''});
      if (chance(.08)) variables.push({id:uid('V'),employeId:e.id,mois:mo,type:'Retenue absence',nature:'Retenue',montant:round(ri(2000,9000),500),motif:'Absence non justifiée'});
      if (chance(.07)) variables.push({id:uid('V'),employeId:e.id,mois:mo,type:'Avance sur salaire',nature:'Avance',montant:round(ri(10000,40000),1000),motif:''});
    });
  });

  /* ---------- Articles ---------- */
  const CATS = [
    {cat:'Valises de diagnostic',items:['Valise diag multimarque','Scanner pro tablette 10"','Interface OBD2 Bluetooth','Testeur de batterie numérique','Station de programmation'],brands:['Launch','Autel','Delphi','Texa','Bosch'],p:[28000,480000],ser:true,g:[12,24]},
    {cat:'Calculateurs & modules',items:['Calculateur moteur EDC17','Calculateur ABS/ESP','Module BSI','Calculateur airbag','Module confort','Boîtier papillon motorisé'],brands:['Bosch','Continental','Siemens VDO','Magneti Marelli','Denso'],p:[24000,190000],ser:true,g:[6,12]},
    {cat:'Capteurs',items:['Capteur PMH','Sonde lambda','Débitmètre d’air','Capteur ABS','Capteur pression rail','Capteur arbre à cames'],brands:['Bosch','NGK','Valeo','Hella'],p:[2400,19000],ser:false,g:[6]},
    {cat:'Écrans & combinés',items:['Combiné compteur','Écran multimédia 9"','Afficheur climatisation','Caméra de recul'],brands:['Continental','Visteon','Valeo'],p:[14000,72000],ser:true,g:[12]},
    {cat:'Alimentation & charge',items:['Chargeur intelligent 12/24V','Booster de démarrage','Convertisseur 12/220V','Maintien de charge OBD'],brands:['CTEK','Noco','Telwin'],p:[6500,58000],ser:true,g:[12,24]},
    {cat:'Câbles & connectique',items:['Câble OBD 16 broches','Faisceau adaptateur','Connecteur ECU 121 broches','Câble banc ECU'],brands:['Launch','Autel','Générique'],p:[800,9500],ser:false,g:[3]},
    {cat:'Outillage atelier',items:['Multimètre automobile','Oscilloscope 4 voies','Programmateur de clés','Station de soudage','Endoscope numérique'],brands:['Fluke','Hantek','Xhorse','Weller'],p:[9000,260000],ser:true,g:[12]},
    {cat:'Consommables',items:['Pâte thermique','Kit étain de soudure','Gaine thermorétractable','Nettoyant contacts','Flux de soudure'],brands:['Würth','Kontakt','Générique'],p:[300,2600],ser:false,g:[0]},
  ];
  const articles = []; let refN = 1000;
  CATS.forEach(c => c.items.forEach(it => {
    const brands = c.brands.slice().sort(()=>rnd()-.5).slice(0, ri(2, Math.min(3,c.brands.length)));
    brands.forEach(b => {
      const pa = round(c.p[0] + Math.pow(rnd(),1.6)*(c.p[1]-c.p[0]), 10);
      const marge = 1.38 + rnd()*.3;
      const min = c.ser ? ri(10,24) : ri(60,180);
      const stocks = {}; const prof = rnd();
      depots.forEach((d,i) => {
        const w = [.4,.25,.2,.15][i];
        const tot = prof < .06 ? 0 : prof < .2 ? min*(0.2+rnd()*.7) : prof < .9 ? min*(1.3+rnd()*2.2) : min*(4.2+rnd()*1.5);
        stocks[d.id] = chance(.07) && prof >= .06 ? 0 : Math.round(tot*w*(0.7+rnd()*.6));
      });
      articles.push({
        id: uid('A'), ref: `${c.cat.slice(0,3).toUpperCase().normalize('NFD').replace(/[̀-ͯ]/g,'')}-${refN++}`,
        designation: `${it} ${b}`, categorie: c.cat, marque: b, unite: 'Unité',
        prixAchat: pa, prixVente: round(pa*marge,10), cmup: round(pa*(0.97+rnd()*.06),1),
        methode: chance(.8)?'CMUP':'FIFO', stockMin: min, stockMax: min*4, serialise: c.ser,
        garantieMois: pick(c.g), stocks, emplacement: `${pick(['A','B','C','D'])}${ri(1,12)}-${ri(1,6)}`, actif:true
      });
    });
  }));

  /* ---------- Clients ---------- */
  const PREF = ['SARL','EURL','Garage','Ets','SNC','Auto','Atelier','SPA'];
  const CORE = ['El Nour','Atlas','Sahel','Djurdjura','Tassili','Hoggar','El Bahia','Numidia','Cirta','Saoura','Ennasr','El Feth','Amal','Rimal','Zianides','Tafna','Medjerda','Chélif','Errahma','El Wiam','Ibn Badis','Essalam','Tadjmout','Seybouse','Mazafran','El Hidhab','Tikjda','El Kala','Belezma','Ahaggar'];
  const SUFF = ['Auto','Diagnostic','Services','Motors','Mécanique','Électronique auto','Pièces','Car Center',''];
  const TYPES_CL = ['Garage indépendant','Garage indépendant','Concessionnaire','Flotte d’entreprise','Revendeur pièces','Revendeur pièces','Particulier','Auto-école'];
  const clients = []; const usedNames = new Set();
  for (let i=0;i<96;i++){

const IDB = {
  db:null,
  open(){ return new Promise((res,rej)=>{ try{ const r = indexedDB.open('asd-erp',1); r.onupgradeneeded=()=>r.result.createObjectStore('kv'); r.onsuccess=()=>{this.db=r.result;res(this.db)}; r.onerror=()=>rej(r.error);}catch(e){rej(e)} }); },
  get(k){ return new Promise((res,rej)=>{ const t=this.db.transaction('kv').objectStore('kv').get(k); t.onsuccess=()=>res(t.result); t.onerror=()=>rej(t.error); }); },
  set(k,v){ return new Promise((res,rej)=>{ const tx=this.db.transaction('kv','readwrite'); tx.objectStore('kv').put(v,k); tx.oncomplete=()=>res(); tx.onerror=()=>rej(tx.error); }); },
  del(k){ return new Promise((res)=>{ const tx=this.db.transaction('kv','readwrite'); tx.objectStore('kv').delete(k); tx.oncomplete=()=>res(); tx.onerror=()=>res(); }); }
};

/* ================= TABLEAU FILTRABLE ================= */
const OPS = {
  text:[['contains','contient'],['ncontains','ne contient pas'],['eq','est égal à'],['starts','commence par'],['empty','est vide'],['nempty','n’est pas vide']],
  num:[['gte','≥'],['lte','≤'],['gt','>'],['lt','<'],['eq','='],['neq','≠'],['between','entre']],
  date:[['last7','7 derniers jours'],['last30','30 derniers jours'],['last90','90 derniers jours'],['thismonth','ce mois-ci'],['thisyear','cette année'],['past','dépassée (avant aujourd’hui)'],['next30','dans les 30 prochains jours'],['on','le'],['before','avant le'],['after','après le'],['between','entre']],
  enum:[['in','est'],['nin','n’est pas']],
  bool:[['true','oui'],['false','non']],
};
const opType = t => t==='money'||t==='num' ? 'num' : t==='date' ? 'date' : t==='enum' ? 'enum' : t==='bool' ? 'bool' : 'text';
const noValueOps = new Set(['empty','nempty','last7','last30','last90','thismonth','thisyear','past','next30','true','false']);

function colVal(col, r){ return col.get ? col.get(r) : r[col.key]; }
function testRule(v, rule, type){
  const op = rule.op, a = rule.v, b = rule.v2;
  switch(opType(type)){
    case 'num': { const x = Number(v), y = Number(a), z = Number(b); if (a===''||a==null) return true;
      return op==='gte'?x>=y:op==='lte'?x<=y:op==='gt'?x>y:op==='lt'?x<y:op==='eq'?x===y:op==='neq'?x!==y:op==='between'?(x>=y&&(b===''||x<=z)):true; }
    case 'date': { const s = v||''; if (!s && !noValueOps.has(op)) return a ? false : true; if (!s) return false;
      if (op==='last7') return s>=addDays(TODAY,-7)&&s<=TODAY; if (op==='last30') return s>=addDays(TODAY,-30)&&s<=TODAY; if (op==='last90') return s>=addDays(TODAY,-90)&&s<=TODAY;
      if (op==='thismonth') return s.slice(0,7)===TODAY.slice(0,7); if (op==='thisyear') return s.slice(0,4)===TODAY.slice(0,4);
      if (op==='past') return s<TODAY; if (op==='next30') return s>=TODAY&&s<=addDays(TODAY,30);
      if (!a) return true; if (op==='on') return s===a; if (op==='before') return s<a; if (op==='after') return s>a; if (op==='between') return s>=a&&(!b||s<=b); return true; }
    case 'enum': { if (!a) return true; return op==='in' ? String(v)===a : String(v)!==a; }
    case 'bool': return op==='true' ? !!v : !v;
    default: { const s = String(v??'').toLowerCase(), q = String(a??'').toLowerCase();
      if (op==='empty') return !s; if (op==='nempty') return !!s; if (!q) return true;
      return op==='contains'?s.includes(q):op==='ncontains'?!s.includes(q):op==='eq'?s===q:op==='starts'?s.startsWith(q):true; }
  }
}
const norm = s => String(s??'').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'');
function tState(id){ return UI.tables[id] ||= {q:'',facets:{},rules:[],match:'all',sort:null,page:0,size:25,hidden:null,showBuilder:false}; }

function filterRows(cfg, st){
  let rows = cfg.rows();
  const cols = cfg.columns;
  if (st.q) { const terms = norm(st.q).split(/\s+/).filter(Boolean); rows = rows.filter(r => { const hay = norm(cols.map(c=>{ const v = colVal(c,r); return c.type==='date'?fd(v)+' '+v:v; }).join(' ') + ' ' + (cfg.searchExtra?cfg.searchExtra(r):'')); return terms.every(t=>hay.includes(t)); }); }
  Object.entries(st.facets||{}).forEach(([k,vals]) => { if (!vals || !vals.length) return; const col = cols.find(c=>c.key===k); if (!col) return; rows = rows.filter(r => vals.includes(String(colVal(col,r)))); });
  const rules = (st.rules||[]).filter(r => r.key && cols.find(c=>c.key===r.key));
  if (rules.length) rows = rows.filter(r => { const res = rules.map(rule => { const col = cols.find(c=>c.key===rule.key); return testRule(colVal(col,r), rule, col.type); }); return st.match==='any' ? res.some(Boolean) : res.every(Boolean); });
  if (st.sort) { const col = cols.find(c=>c.key===st.sort.key); if (col) { const dir = st.sort.dir; const isN = ['num','money'].includes(col.type); rows = rows.slice().sort((a,b) => { let x = colVal(col,a), y = colVal(col,b); if (isN) return ((+x||0)-(+y||0))*dir; return String(x??'').localeCompare(String(y??''),'fr',{numeric:true})*dir; }); } }
  return rows;
}
function enumOptions(cfg, col){ if (col.options) return col.options; const s = new Set(); cfg.rows().forEach(r => { const v = colVal(col,r); if (v!==''&&v!=null) s.add(String(v)); }); return [...s].sort((a,b)=>a.localeCompare(b,'fr')); }
function cellHtml(col, r){
  if (col.render) return col.render(r);
  const v = colVal(col, r);
  if (col.type==='money') return v==null||v===''?'—':da(v);
  if (col.type==='num') return v==null||v===''?'—':num(v);
  if (col.type==='date') return v?fd(v):'<span class="muted">—</span>';
  if (col.type==='enum' && col.pill!==false) return pill(v);
  if (col.type==='bool') return v?'Oui':'<span class="muted">Non</span>';
  return esc(v);
}
function ruleLabel(cfg, rule){
  const col = cfg.columns.find(c=>c.key===rule.key); if (!col) return '';
  const op = (OPS[opType(col.type)].find(o=>o[0]===rule.op)||['',''])[1];
  let v = noValueOps.has(rule.op) ? '' : (col.type==='date' ? fd(rule.v) : col.type==='money'? da(rule.v) : rule.v);
  if (rule.op==='between') v = `${col.type==='date'?fd(rule.v):rule.v} et ${col.type==='date'?fd(rule.v2):rule.v2}`;
  return `<b>${esc(col.label)}</b> ${esc(op)} ${esc(v)}`;
}

function renderTable(el, cfg){
  const st = tState(cfg.id);
  if (!st.hidden) st.hidden = cfg.columns.filter(c=>c.hidden).map(c=>c.key);

  el.innerHTML = `<div class="dt">

  function renderFacets(){
    const box = el.querySelector(`#fac-${cfg.id}`); if (!box) return;
    // counts based on all filters except this facet
    box.innerHTML = facets.map(col => {
      const others = {...st, facets:{...st.facets, [col.key]:[]}, sort:null};
      const base = filterRows(cfg, others);
      const counts = {}; base.forEach(r => { const v = String(colVal(col,r)); counts[v] = (counts[v]||0)+1; });
      const opts = (col.facetOptions || enumOptions(cfg,col)).filter(o => counts[o] || (st.facets[col.key]||[]).includes(o));
      const sel = st.facets[col.key] || [];
      return `<div class="facet"><span class="facet-l">${esc(col.label)}</span>${opts.map(o => `<button class="chip ${sel.includes(o)?'on':''}" data-facet="${esc(col.key)}" data-v="${esc(o)}">${esc(col.facetLabel?col.facetLabel(o):o)} <span class="c">${counts[o]||0}</span></button>`).join('')}</div>`;
    }).join('');
  }
  function renderBuilder(){
    const box = el.querySelector(`#bld-${cfg.id}`);
    if (!st.showBuilder) { box.innerHTML=''; return; }
    const fcols = cfg.columns.filter(c=>c.filter!==false);
    const ruleRow = (r,i) => {
      const col = fcols.find(c=>c.key===r.key) || fcols[0];
      const ot = opType(col.type); const ops = OPS[ot];
      let vals = '';
      if (!noValueOps.has(r.op)) {
        if (ot==='enum') vals = `<select class="sel" data-rv="${i}"><option value="">— choisir —</option>${enumOptions(cfg,col).map(o=>`<option ${o===r.v?'selected':''}>${esc(o)}</option>`).join('')}</select>`;
        else { const it = ot==='num'?'number':ot==='date'?'date':'text'; vals = `<input class="inp" type="${it}" data-rv="${i}" value="${esc(r.v??'')}" placeholder="${ot==='num'?'Valeur':''}">` + (r.op==='between' ? `<input class="inp" type="${it}" data-rv2="${i}" value="${esc(r.v2??'')}">` : ''); }
      }
      return `<div class="rule">
        <select class="sel" data-rk="${i}" aria-label="Champ">${fcols.map(c=>`<option value="${esc(c.key)}" ${c.key===col.key?'selected':''}>${esc(c.label)}</option>`).join('')}</select>

    box.innerHTML = `<div class="builder">

        des conditions suivantes</div>
      ${st.rules.map(ruleRow).join('') || '<div class="muted" style="font-size:12.5px">Aucune condition. Ajoutez-en une pour filtrer par montant, date, statut…</div>'}
      <div style="display:flex;gap:8px;flex-wrap:wrap">
        <button class="btn sm" data-radd>${ic('plus')} Ajouter une condition</button>
        ${presets.length ? `<span class="muted" style="align-self:center;font-size:12px;margin-left:6px">Filtres rapides :</span>` + presets.map((p,i)=>`<button class="btn sm ghost" data-preset="${i}">${esc(p.name)}</button>`).join('') : ''}
        <span class="dt-spacer"></span>

      </div></div>`;
  }
  function renderActive(){

    const items = [];
    Object.entries(st.facets).forEach(([k,vals]) => (vals||[]).forEach(v => { const col = cfg.columns.find(c=>c.key===k); if (col) items.push(`<span class="af"><span><b>${esc(col.label)}</b> : ${esc(v)}</span><button data-afx="f|${esc(k)}|${esc(v)}" aria-label="Retirer">×</button></span>`); }));
    st.rules.forEach((r,i) => { const l = ruleLabel(cfg, r); if (l && (noValueOps.has(r.op) || r.v!=='' && r.v!=null)) items.push(`<span class="af"><span>${l}</span><button data-afx="r|${i}" aria-label="Retirer">×</button></span>`); });

  function renderResults(){

      <tbody>${slice.length ? slice.map((r,i)=>`<tr data-i="${st.page*st.size+i}">${vis.map(c=>`<td class="${['money','num'].includes(c.type)||c.align==='r'?'num':''} ${c.strong?'strong':''}">${cellHtml(c,r)}</td>`).join('')}${cfg.rowActions?`<td class="num">${cfg.rowActions(r)}</td>`:''}</tr>`).join('') : `<tr><td colspan="${vis.length+(cfg.rowActions?1:0)}" class="empty">Aucun résultat pour ces filtres. <button class="btn sm" data-afx="all" style="margin-left:6px">Effacer les filtres</button></td></tr>`}</tbody>
      ${anySum && rows.length ? `<tfoot><tr>${vis.map((c,i)=> i===0 ? `<td>Total filtré</td>` : sums[i]!==null ? `<td class="num">${c.type==='money'?da(sums[i]):num(sums[i])}</td>` : '<td></td>').join('')}${cfg.rowActions?'<td></td>':''}</tr></tfoot>`:''}
    </table></div>
    <div class="dt-foot"><span><b style="color:var(--fg)">${num(rows.length)}</b> ligne${rows.length>1?'s':''} sur ${num(cfg.rows().length)}</span>
      <div class="pager"><select class="sel" data-size style="padding:4px 6px">${[10,25,50,100].map(n=>`<option ${n===st.size?'selected':''} value="${n}">${n} / page</option>`).join('')}</select>
      <button class="btn sm" data-pg="-1" ${st.page===0?'disabled':''}>Précédent</button><span style="padding:0 6px">${st.page+1} / ${pages}</span><button class="btn sm" data-pg="1" ${st.page>=pages-1?'disabled':''}>Suivant</button></div></div>`;
    res._rows = rows;

  renderBuilder(); renderResults();

  el.onclick = e => {
    const t = e.target.closest('[data-t],[data-facet],[data-afx],[data-sort],[data-pg],[data-radd],[data-rdel],[data-rclear],[data-preset],[data-act],tr[data-i]');
    if (!t) return;
    if (t.dataset.act) { e.stopPropagation(); const tr = t.closest('tr'); const rows = el.querySelector(`#res-${cfg.id}`)._rows; cfg.onAction && cfg.onAction(t.dataset.act, rows[+tr.dataset.i]); return; }
    if (t.dataset.t==='builder') { st.showBuilder = !st.showBuilder; if (st.showBuilder && !st.rules.length) st.rules.push(defaultRule()); saveUI(); renderTable(el,cfg); return; }
    if (t.dataset.t==='views') { viewsMenu(t); return; }
    if (t.dataset.t==='cols') { colsMenu(t); return; }

    if (t.matches('tr[data-i]')) { const rows = el.querySelector(`#res-${cfg.id}`)._rows; const r = rows[+t.dataset.i]; if (r && cfg.onRow) cfg.onRow(r); }

    if (t.dataset.ro!==undefined) { const r = st.rules[+t.dataset.ro]; r.op = t.value; renderBuilder(); renderResults(); saveUI(); return; }

    if (t.hasAttribute('data-size')) { st.size = +t.value; st.page=0; renderResults(); saveUI(); return; }
  };
  el.oninput = e => {

function openForm({eyebrow='Saisie', title, fields, values={}, onSave, submitLabel='Enregistrer', onDelete}){
  const f = (x) => {

    else if (x.type==='textarea') input = `<textarea class="inp" id="${id}" name="${x.key}" rows="3">${esc(v)}</textarea>`;
    else if (x.type==='checkbox') input = `<label style="display:flex;gap:8px;align-items:center;padding:6px 0"><input type="checkbox" id="${id}" name="${x.key}" ${v?'checked':''}> ${esc(x.hint||'')}</label>`;
    else input = `<input class="inp" id="${id}" name="${x.key}" type="${x.type||'text'}" value="${esc(v)}" ${x.step?`step="${x.step}"`:''} ${x.min!=null?`min="${x.min}"`:''} placeholder="${esc(x.placeholder||'')}">`;
    return `<div class="field ${x.full?'full':''}"><label for="${id}">${esc(x.label)}${x.required?' *':''}</label>${input}</div>`;
  };

    body:`<form id="frm" class="form-grid" novalidate>${fields.map(f).join('')}<div class="err full" id="frmErr"></div><button type="submit" hidden></button></form>`,

    onMount: d => {

          if (x.required && (v===''||v==null)) { d.querySelector('#frmErr').textContent = `Le champ « ${x.label} » est obligatoire.`; elx.focus(); return; } }
        const err = onSave(out); if (typeof err === 'string') { d.querySelector('#frmErr').textContent = err; return; }

    </div>
    <div class="panel" style="margin-bottom:14px">

      <div class="panel"><div class="panel-h"><h3>Balance âgée des créances</h3><span class="sub">Reste à encaisser par ancienneté</span></div><div class="chart-box sm"><canvas id="cAG" role="img" aria-label="Balance âgée"></canvas></div></div>
      <div class="panel"><div class="panel-h"><h3>Stock par catégorie</h3><span class="sub">Valeur au CMUP${f.depot?' · '+esc(dep(f.depot).nom):''}</span></div><div class="chart-box sm"><canvas id="cST" role="img" aria-label="Valeur du stock par catégorie"></canvas></div></div>
    </div>
    <div class="grid g-2">
      <div class="panel"><div class="panel-h"><h3>Meilleures ventes</h3><span class="sub">Articles par CA HT, ${esc(pLabel)}</span></div><div class="toplist" id="top"></div></div>

    </div>`;
  const v = document.getElementById('view');
  v.querySelectorAll('#dPer button').forEach(b => b.onclick = () => { f.periode = b.dataset.v; saveUI(); render(); });
  v.querySelector('#dDep').onchange = e => { f.depot = e.target.value; saveUI(); render(); };
  v.querySelector('#dCom').onchange = e => { f.commercial = e.target.value; saveUI(); render(); };
  v.querySelectorAll('[data-go]').forEach(k => k.onclick = () => go(k.dataset.go));

  // pipeline
  const stages = ['Brouillon','Validée','Préparée','Expédiée','En livraison','Livrée'];
  const cnt = stages.map(s => cmdP.filter(c=>c.statut===s).length); const mx = Math.max(...cnt,1);
  v.querySelector('#pipe').innerHTML = stages.map((s,i)=>`<div class="pipe-s" data-st="${s}" role="button" tabindex="0"><div class="l">${i+1}. ${s}</div><div class="n">${cnt[i]}</div><div class="b" style="width:${Math.max(4,cnt[i]/mx*100)}%;${s==='Livrée'?'background:var(--ok)':''}"></div></div>`).join('');
  v.querySelectorAll('.pipe-s').forEach(p => p.onclick = () => goFiltered('ventes','commandes','commandes',{facets:{statut:[p.dataset.st]}}));

  // CA chart
  const months = []; for (let i=11;i>=0;i--){ const d = new Date(); d.setDate(1); d.setMonth(d.getMonth()-i); months.push(isoD(d).slice(0,7)); }
  const caA = months.map(m => sum(facs.filter(x=>x.date.startsWith(m)&&x.circuit==='A'), x=>x.ht));
  const caB = months.map(m => sum(facs.filter(x=>x.date.startsWith(m)&&x.circuit==='B'), x=>x.ht));
  const [s1,s2,s3,s4] = SER();
  chart('cCA',{type:'bar',stacked:true,data:{labels:months.map(monthLabel),datasets:[{label:'Circuit A',data:caA,backgroundColor:s1,borderRadius:4,borderColor:cssVar('--surface'),borderWidth:{top:2},maxBarThickness:28},{label:'Circuit B',data:caB,backgroundColor:s2,borderRadius:4,borderColor:cssVar('--surface'),borderWidth:{top:2},maxBarThickness:28}]}});

  // tréso weekly
  const wk = []; for (let i=25;i>=0;i--) wk.push(addDays(TODAY,-i*7));
  const tv = wk.map(d => sum(D.comptes, c=>compteSolde(c,d)));
  chart('cTR',{type:'line',data:{labels:wk.map(fd).map(s=>s.slice(0,5)),datasets:[{label:'Trésorerie',data:tv,borderColor:s3,backgroundColor:s3+'22',fill:true,tension:.3,pointRadius:0,pointHoverRadius:4,borderWidth:2}]},beginAtZero:false});

  // aging
  const B = [['Non échu',0],['1–30 j',0],['31–60 j',0],['61–90 j',0],['> 90 j',0]];
  openF.forEach(x => { const j = joursRetard(x); const r = facReste(x); B[j<=0?0:j<=30?1:j<=60?2:j<=90?3:4][1]+=r; });
  chart('cAG',{type:'bar',data:{labels:B.map(b=>b[0]),datasets:[{data:B.map(b=>b[1]),backgroundColor:[s1,s4,s4,s2,s2].map((c,i)=>i===0?cssVar('--s1'):c),borderRadius:4,maxBarThickness:34}]}});

  // stock by cat
  const cats = groupBy(D.articles, a=>a.categorie); const cv = Object.entries(cats).map(([k,arr])=>[k,sum(arr,a=>qtyDep(a,f.depot)*a.cmup)]).sort((a,b)=>b[1]-a[1]);
  chart('cST',{type:'bar',indexAxis:'y',data:{labels:cv.map(c=>c[0]),datasets:[{data:cv.map(c=>c[1]),backgroundColor:s1,borderRadius:4,maxBarThickness:16}]},options:{scales:{y:{grid:{display:false},ticks:{color:cssVar('--muted'),font:{size:11}}},x:{grid:{color:cssVar('--line')},ticks:{color:cssVar('--muted'),maxRotation:0,maxTicksLimit:4,callback:v=>kda(v)}}}}});

  // top articles
  const ta = {}; cmdP.forEach(c => c.lignes.forEach(l => { ta[l.articleId] = (ta[l.articleId]||0) + l.qte*l.pu*(1-l.remise/100); }));
  const tops = Object.entries(ta).sort((a,b)=>b[1]-a[1]).slice(0,7); const tm = tops[0]?.[1]||1;
  v.querySelector('#top').innerHTML = tops.map(([id,val])=>`<div class="tl-row" style="cursor:pointer" data-art="${id}"><span>${esc(art(id).designation)} <span class="muted mono">${esc(art(id).ref)}</span></span><span class="num">${kda(val)}</span><div class="bar"><i style="width:${val/tm*100}%"></i></div></div>`).join('') || '<div class="empty">Aucune vente sur la période.</div>';
  v.querySelectorAll('[data-art]').forEach(r => r.onclick = () => openArticle(art(r.dataset.art)));
  const tc = {}; cmdP.forEach(c => { tc[c.commercialId] = (tc[c.commercialId]||0) + c.montantHT; });
  const topc = Object.entries(tc).sort((a,b)=>b[1]-a[1]).slice(0,8); const tcm = topc[0]?.[1]||1;
  v.querySelector('#topc').innerHTML = topc.map(([id,val])=>`<div class="tl-row"><span>${esc(empName(id))} <span class="muted">· ${esc(emp(id).wilaya||'')}</span></span><span class="num">${kda(val)}</span><div class="bar"><i style="width:${val/tcm*100}%;background:${s3}"></i></div></div>`).join('') || '<div class="empty">Aucune donnée.</div>';

  // alerts
  const al = [];
  const rupt = D.articles.filter(a=>stockStatut(a,f.depot)==='Rupture');
  if (rupt.length) al.push(['bad','!',`${rupt.length} article${rupt.length>1?'s':''} en rupture de stock`, rupt.slice(0,3).map(a=>a.designation).join(', ')+(rupt.length>3?'…':''), ()=>goFiltered('stock','alertes','alertes',{})]);
  const chq = D.cheques.filter(c=>c.sens==='Reçu'&&c.statut==='En portefeuille'&&c.dateEcheance<=addDays(TODAY,7));
  if (chq.length) al.push(['warn','Ch',`${chq.length} chèque${chq.length>1?'s':''} à présenter sous 7 jours`, `${da(sum(chq,c=>c.montant))} en portefeuille`, ()=>goFiltered('tresorerie','cheques','cheques',{facets:{statut:['En portefeuille']},rules:[{key:'dateEcheance',op:'before',v:addDays(TODAY,8),v2:''}]})]);
  const late90 = openF.filter(x=>joursRetard(x)>90);
  if (late90.length) al.push(['bad','€',`${late90.length} facture${late90.length>1?'s':''} impayée${late90.length>1?'s':''} depuis plus de 90 jours`, `${da(sum(late90,facReste))} à recouvrer`, ()=>goFiltered('creances','factures','factures',{rules:[{key:'jr',op:'gt',v:'90',v2:''}]})]);
  const ctr = D.employes.filter(e=>e.statut==='Actif'&&e.finContrat&&e.finContrat>=TODAY&&e.finContrat<=addDays(TODAY,30));
  if (ctr.length && canSee('rh')) al.push(['warn','RH',`${ctr.length} contrat${ctr.length>1?'s':''} arrive${ctr.length>1?'nt':''} à échéance sous 30 jours`, ctr.slice(0,2).map(e=>e.prenom+' '+e.nom).join(', ')+(ctr.length>2?'…':''), ()=>go('rh','contrats')]);
  const crit = tickets.filter(t=>t.priorite==='Critique'&&['Ouvert','En cours'].includes(t.statut));
  if (crit.length) al.push(['bad','SAV',`${crit.length} ticket${crit.length>1?'s':''} SAV critique${crit.length>1?'s':''} non résolu${crit.length>1?'s':''}`, 'Priorité critique', ()=>goFiltered('sav','tickets','tickets',{facets:{priorite:['Critique'],statut:['Ouvert','En cours']}})]);
  const lowC = D.comptes.filter(c=>compteSolde(c)<c.seuil);
  if (lowC.length) al.push(['bad','DA',`${lowC.length} compte${lowC.length>1?'s':''} sous le seuil critique`, lowC.map(c=>c.libelle.split(' — ')[0]).join(', '), ()=>go('tresorerie','comptes')]);
  const lp = cmds.filter(c=>c.statut==='En livraison'&&['Reporté','Absent','Refusé'].includes(c.statutLivraison));
  if (lp.length) al.push(['warn','Lv',`${lp.length} livraison${lp.length>1?'s':''} en échec (reportée, absent, refusée)`, 'À replanifier', ()=>go('ventes','livraisons')]);
  const ecarts = D.achats.filter(b=>b.rapprochement.startsWith('Écart'));
  if (ecarts.length && canSee('fournisseurs')) al.push(['info','BC',`${ecarts.length} réception${ecarts.length>1?'s':''} fournisseur avec écart`, 'Rapprochement BC / BL / facture', ()=>goFiltered('fournisseurs','bc','achats',{facets:{rapprochement:['Écart quantité','Écart prix']}})]);
  v.querySelector('#alerts').innerHTML = al.map((a,i)=>`<div class="al" data-al="${i}" role="button" tabindex="0"><div class="ic ${a[0]}">${a[1]}</div><div style="min-width:0"><div>${esc(a[2])}</div><div class="m">${esc(a[3])}</div></div></div>`).join('') || '<div class="empty">Rien à signaler.</div>';
  v.querySelectorAll('[data-al]').forEach(x => x.onclick = () => al[+x.dataset.al][4]());
}

/* ================= VENTES & LIVRAISONS ================= */
const CMD_FLOW = ['Brouillon','Validée','Préparée','Expédiée','En livraison','Livrée'];
const stepper = (flow, cur) => { const i = flow.indexOf(cur); return `<span class="stepper" title="${esc(cur)}">${flow.map((s,k)=>`<i class="${cur==='Annulée'?'cancel':k<=i?'done':''}"></i>`).join('')}</span>`; };
function renderVentes(){
  const cmds = S.commandes();
  const enCours = cmds.filter(c=>['Validée','Préparée','Expédiée','En livraison'].includes(c.statut));
  const liv = cmds.filter(c=>c.statut==='En livraison');
  const mois = cmds.filter(c=>c.date.slice(0,7)===TODAY.slice(0,7) && c.statut!=='Annulée');
  page({mod:'ventes', eyebrow:'Opérations', title:'Ventes & livraisons', sub:'Commandes clients et suivi du cycle commande → livraison. Les statuts saisis par les livreurs remontent ici.',
    kpis:[{l:'Commandes ce mois',v:num(mois.length),s:kda(sum(mois,c=>c.montantHT))+' HT'},{l:'En cours de traitement',v:num(enCours.length),s:kda(sum(enCours,c=>c.ttc))+' TTC'},{l:'En livraison',v:num(liv.length),s:`${liv.filter(c=>c.statutLivraison!=='En route').length} en échec`,go:'livraisons'},{l:'Taux de livraison à temps',v:Math.round(cmds.filter(c=>c.dateLivraison&&c.dateLivraison<=c.dateLivraisonPrevue).length/Math.max(1,cmds.filter(c=>c.dateLivraison).length)*100)+' %',s:'Commandes livrées'}],

}
function cmdTableCfg(){

    facets:['statut','circuit','depot'],

      {name:'Ce mois-ci',rules:[{key:'date',op:'thismonth',v:'',v2:''}]},

function openCommande(c){
  const cl = cli(c.clientId); const fac = D.factures.find(f=>f.commandeId===c.id);
  const i = CMD_FLOW.indexOf(c.statut); const next = c.statut!=='Annulée' && i>=0 && i<CMD_FLOW.length-1 ? CMD_FLOW[i+1] : null;
  const verb = {Validée:'Valider la commande',Préparée:'Marquer préparée',Expédiée:'Expédier et facturer','En livraison':'Mettre en livraison',Livrée:'Confirmer la livraison'};
  openDrawer({eyebrow:'Commande client', title:`${c.num}`,
    body: `<div style="display:flex;gap:8px;flex-wrap:wrap;align-items:center">${pill(c.statut)} ${circ(c.circuit)} ${stepper(CMD_FLOW,c.statut)}</div>`
      + kv([['Client',`<a href="#" data-cl>${esc(cl.raison)}</a> <span class="muted">(${esc(cl.code)})</span>`],['Date',fd(c.date)],['Commercial',esc(empName(c.commercialId))],['Dépôt',esc(dep(c.depotId).nom)],['Adresse de livraison',esc(c.adresse)],['Livraison prévue',fd(c.dateLivraisonPrevue)],['Livreur',c.livreurId?esc(empName(c.livreurId)):''],['Statut livraison',c.statutLivraison?pill(c.statutLivraison):''],['Livrée le',fd(c.dateLivraison)],['Facture',fac?`<a href="#" data-fac>${fac.num}</a> · ${pill(facStatut(fac))}`:'']])
      + sec('Lignes', miniTable(['Article','#Qté','#PU HT','#Remise','#Total HT'], c.lignes.map(l=>[`${esc(art(l.articleId).designation)}<div class="muted mono" style="font-size:11px">${esc(art(l.articleId).ref)}</div>`, num(l.qte), da(l.pu), l.remise?l.remise+' %':'—', da(l.qte*l.pu*(1-l.remise/100))]).concat([[`<b>Total</b>`,'','','',`<b>${da(c.montantHT)}</b>`],['TVA '+(c.circuit==='A'?'19 %':'(non soumis)'),'','','',da(c.tva)],['<b>Total TTC</b>','','','',`<b>${da(c.ttc)}</b>`]])))
      + (cl.plafond ? sec('Encours client', encoursBar(cl)) : ''),
    foot: `${c.statut!=='Livrée'&&c.statut!=='Annulée'?`<button class="btn danger" data-cancel style="margin-right:auto">Annuler</button>`:''}${next?`<button class="btn primary" data-next>${ic('check')} ${verb[next]}</button>`:''}`,
    onMount: d => {
      d.querySelector('[data-cl]').onclick = e => { e.preventDefault(); openClient(cl); };
      const fa = d.querySelector('[data-fac]'); if (fa) fa.onclick = e => { e.preventDefault(); openFacture(fac); };
      const nx = d.querySelector('[data-next]'); if (nx) nx.onclick = () => { advanceCommande(c, next); openCommande(c); render(); };
      const cn = d.querySelector('[data-cancel]'); if (cn) cn.onclick = () => { if (!cn.dataset.c) { cn.dataset.c=1; cn.textContent='Confirmer l’annulation'; return; } c.statut='Annulée'; c.statutLivraison=''; save(); toast(`${c.num} annulée`); closeDrawer(); render(); };
    }});
}
function advanceCommande(c, next){
  c.statut = next;
  if (next==='Expédiée') {
    if (!c.livreurId) c.livreurId = (D.employes.find(e=>e.poste==='Livreur'&&e.depotId===c.depotId) || D.employes.find(e=>e.poste==='Livreur')).id;
    c.lignes.forEach(l => { const a = art(l.articleId); a.stocks[c.depotId] = Math.max(0,(a.stocks[c.depotId]||0)-l.qte); D.mouvements.unshift({id:newId('M'),date:TODAY,type:'Sortie',articleId:a.id,depotId:c.depotId,depotDestId:'',qte:l.qte,coutUnitaire:a.cmup,reference:c.num,motif:'Livraison client',utilisateur:PROFILES[UI.profile].label}); });
    if (!D.factures.find(f=>f.commandeId===c.id)) { const cl = cli(c.clientId); const f = {id:newId('FA'),num:nextNum(D.factures,'num','FA'),commandeId:c.id,clientId:c.clientId,commercialId:c.commercialId,date:TODAY,echeance:addDays(TODAY,cl.delai),ht:c.montantHT,tva:c.tva,ttc:c.ttc,regle:0,circuit:c.circuit,echeances:[]}; D.factures.unshift(f);
      const l = [['411000',f.ttc,0],['700000',0,f.ht]]; if (f.tva) l.push(['445700',0,f.tva]); D.ecritures.unshift({id:newId('EC'),num:nextNum(D.ecritures,'num','VTE-'),date:TODAY,journal:'VTE',libelle:`Facture ${f.num} — ${cl.raison}`,circuit:f.circuit,lignes:l,origine:'Créances',reference:f.num,statut:'Brouillard'});
      toast(`Facture ${f.num} générée, écriture comptable passée au circuit ${f.circuit}`); }
  }
  if (next==='En livraison') c.statutLivraison = 'En route';
  if (next==='Livrée') { c.statutLivraison='Livré'; c.dateLivraison=TODAY;
    c.lignes.forEach(l => { const a = art(l.articleId); if (!a.serialise) return; for (let k=0;k<l.qte;k++){ const stockP = D.pieces.find(p=>p.articleId===a.id && p.statut==='En stock'); const p = stockP || {id:newId('P'),serial:`${a.marque.slice(0,2).toUpperCase()}${TODAY.slice(2,4)}${Math.floor(Math.random()*900000+100000)}`,articleId:a.id,dateEntree:TODAY,depotId:c.depotId}; Object.assign(p,{clientId:c.clientId,commandeId:c.id,dateVente:TODAY,garantieMois:a.garantieMois,finGarantie:addMonths(TODAY,a.garantieMois),statut:'Sous garantie'}); if (!stockP) D.pieces.unshift(p); } });
  }
  save(); if (next!=='Expédiée') toast(`${c.num} : ${next}`);
}
function encoursBar(cl){

function openClient(c){
  const facs = D.factures.filter(f=>f.clientId===c.id).sort((a,b)=>b.date.localeCompare(a.date));
  const cmds = D.commandes.filter(x=>x.clientId===c.id && ['Expédiée','En livraison','Validée','Préparée'].includes(x.statut));
  openDrawer({eyebrow:`Client · ${esc(c.type)}`, title:esc(c.raison),
    body: sec('Encours', encoursBar(c)) + kv([['Code',`<span class="mono">${c.code}</span>`],['Wilaya',esc(c.wilaya)],['Commercial',esc(empName(c.commercialId))],['Téléphone',`<span class="mono">${esc(c.tel)}</span>`],['E-mail',esc(c.email)],['Circuit comptable',circ(c.assujettiTVA?'A':'B')],['NIF',c.nif?`<span class="mono">${c.nif}</span>`:''],['RC',c.rc?`<span class="mono">${esc(c.rc)}</span>`:''],['Article d’imposition',c.ai?`<span class="mono">${c.ai}</span>`:''],['Délai de paiement',c.delai?c.delai+' jours':'Comptant'],['Client depuis',fd(c.dateCreation)]])
      + sec('Factures ouvertes', miniTable(['Facture','Échéance','#Reste','Statut'], facs.filter(f=>facReste(f)>0).map(f=>[`<a href="#" data-fa="${f.id}" class="mono">${f.num}</a>`,fd(f.echeance),da(facReste(f)),pill(facStatut(f))])))
      + sec('Commandes en cours et livraisons', miniTable(['Commande','Statut','Livraison','#TTC'], cmds.map(x=>[`<span class="mono">${x.num}</span>`,pill(x.statut),x.statutLivraison?pill(x.statutLivraison):'—',da(x.ttc)])))
      + sec('Tickets SAV', miniTable(['Ticket','Date','Statut'], D.tickets.filter(t=>t.clientId===c.id).slice(0,5).map(t=>[`<span class="mono">${t.num}</span>`,fd(t.date),pill(t.statut)]))),
    foot:`<button class="btn" data-e style="margin-right:auto">${ic('edit')} Modifier</button><button class="btn" data-rl>Envoyer une relance</button><button class="btn primary" data-rg>Enregistrer un règlement</button>`,
    onMount: d => {
      d.querySelectorAll('[data-fa]').forEach(a => a.onclick = e => { e.preventDefault(); openFacture(D.factures.find(f=>f.id===a.dataset.fa)); });
      d.querySelector('[data-e]').onclick = () => clientForm(c);
      d.querySelector('[data-rg]').onclick = () => reglementForm(c.id);
      d.querySelector('[data-rl]').onclick = () => { const late = facs.filter(f=>facReste(f)>0 && f.echeance<TODAY); if (!late.length) { toast('Aucune facture échue pour ce client'); return; } late.forEach(f => D.relances.unshift({id:newId('RL'),date:TODAY,factureId:f.id,clientId:c.id,niveau:Math.min(3,D.relances.filter(r=>r.factureId===f.id).length+1),canal:'Email',statut:'Envoyée',montant:facReste(f)})); save(); toast(`${late.length} relance${late.length>1?'s':''} envoyée${late.length>1?'s':''} à ${c.email}`); };
    }});
}

function openFacture(f){
  const c = cli(f.clientId); const regs = D.reglements.filter(r=>r.factureId===f.id); const cmd = ix().cmd.get(f.commandeId);
  const ech = echAlloc(f);
  openDrawer({eyebrow:'Facture client', title:f.num,
    body:`<div style="display:flex;gap:8px;flex-wrap:wrap">${pill(facStatut(f))} ${circ(f.circuit)}</div>`
      + kv([['Client',`<a href="#" data-c>${esc(c.raison)}</a>`],['Date',fd(f.date)],['Échéance',fd(f.echeance)],['Montant HT',da(f.ht)],['TVA',da(f.tva)],['Montant TTC',`<b>${da(f.ttc)}</b>`],['Réglé',da(f.regle)],['Reste à payer',`<b>${da(facReste(f))}</b>`],['Commande liée',cmd?`<a href="#" data-cmd class="mono">${cmd.num}</a> · ${pill(cmd.statut)}`:''],['Statut livraison',cmd?.statutLivraison?pill(cmd.statutLivraison):'']])
      + (ech.length ? sec('Échéancier de paiement', miniTable(['Échéance','#Montant','#Payé','État'], ech.map(e=>[fd(e.date),da(e.montant),da(e.paye),pill(e.etat)]))) : '')
      + sec('Règlements', miniTable(['N°','Date','Mode','#Montant'], regs.map(r=>[`<span class="mono">${r.num}</span>`,fd(r.date),esc(r.mode)+(r.reference?` <span class="muted mono">${esc(r.reference)}</span>`:''),da(r.montant)])))
      + sec('Relances', miniTable(['Date','Niveau','Canal'], D.relances.filter(r=>r.factureId===f.id).map(r=>[fd(r.date),'Niveau '+r.niveau,esc(r.canal)]))),
    foot: facReste(f)>0 ? `<button class="btn primary" data-rg>Enregistrer un règlement</button>` : '',
    onMount: d => { d.querySelector('[data-c]').onclick = e => { e.preventDefault(); openClient(c); }; const cm = d.querySelector('[data-cmd]'); if (cm) cm.onclick = e => { e.preventDefault(); openCommande(cmd); }; const rg = d.querySelector('[data-rg]'); if (rg) rg.onclick = () => reglementForm(c.id, f.id); }});
}
function echAlloc(f){ let paid = f.regle; return f.echeances.map(e => { const p = Math.min(paid, e.montant); paid -= p; return {...e, paye:p, etat: p>=e.montant?'Payée':e.date<TODAY?'Échu':p>0?'Partielle':e.date<=addDays(TODAY,30)?'À échéance':'À venir'}; }); }
function echeancierCfg(){
  const rows = []; S.factures().forEach(f => echAlloc(f).forEach((e,i,arr) => rows.push({id:f.id+'-'+i,f,n:`${i+1}/${arr.length}`,...e})));
  return {id:'echeanciers', noun:'les échéances', rows:()=>rows, onRow:r=>openFacture(r.f), facets:['etat'],
    columns:[{key:'date',label:'Échéance',type:'date'},{key:'facture',label:'Facture',get:r=>r.f.num,render:r=>`<span class="mono">${r.f.num}</span>`},{key:'n',label:'Versement'},{key:'client',label:'Client',get:r=>cli(r.f.clientId).raison,strong:true},{key:'montant',label:'Montant',type:'money',sum:true},{key:'paye',label:'Payé',type:'money',sum:true},{key:'reste',label:'Reste',type:'money',get:r=>r.montant-r.paye,sum:true},{key:'etat',label:'État',type:'enum',facetOptions:['Échu','À échéance','Partielle','À venir','Payée']}],

}

function reglementForm(clientId, factureId){
  const open = S.factures().filter(f=>facReste(f)>0 && (!clientId || f.clientId===clientId)).sort((a,b)=>a.echeance.localeCompare(b.echeance));
  if (!open.length) { toast('Aucune facture ouverte'); return; }
  const first = factureId ? ix().fac.get(factureId) : open[0];
  openForm({eyebrow:'Créances', title:'Enregistrer un règlement', submitLabel:'Enregistrer',
    fields:[{key:'factureId',label:'Facture',type:'select',options:open.map(f=>[f.id,`${f.num} · ${cli(f.clientId).raison} · reste ${da(facReste(f))}`]),full:true},{key:'montant',label:'Montant (DA)',type:'number',required:true,min:1},{key:'date',label:'Date',type:'date',default:TODAY},
      {key:'mode',label:'Mode de paiement',type:'select',options:['Virement','Chèque','Espèces','Traite']},{key:'reference',label:'N° chèque / référence'},{key:'banque',label:'Banque du tireur',type:'select',allowEmpty:true,options:['BNA','CPA','BEA','BADR','BDL','CNEP','AGB','Société Générale Algérie']},{key:'compteId',label:'Compte de dépôt',type:'select',options:D.comptes.map(c=>[c.id,c.libelle])}],
    values:{factureId:first.id, montant:facReste(first)},
    onSave: v => {
      const f = ix().fac.get(v.factureId); const m = Math.min(+v.montant, facReste(f)); if (m<=0) return 'Montant invalide.';
      const r = {id:newId('R'),num:nextNum(D.reglements,'num','RG'),date:v.date,factureId:f.id,clientId:f.clientId,montant:m,mode:v.mode,reference:v.reference,banque:v.banque};
      D.reglements.unshift(r); f.regle += m;
      if (v.mode==='Chèque') D.cheques.unshift({id:newId('CH'),num:v.reference||String(Math.floor(Math.random()*9e6+1e6)),sens:'Reçu',tiers:cli(f.clientId).raison,tiersId:f.clientId,banque:v.banque||'BNA',montant:m,dateEmission:v.date,dateEcheance:v.date,statut:'En portefeuille',compteId:v.compteId,reglementId:r.id,dateRemise:'',motifRejet:''});
      else D.tresorerie.unshift({id:newId('TR'),date:v.date,compteId:v.mode==='Espèces'?'CA1':v.compteId,sens:'Encaissement',categorie:'Règlement client',montant:m,libelle:`${r.num} — ${cli(f.clientId).raison}`,reference:r.num,rapproche:false});
      const acc = v.mode==='Chèque' ? '511000' : v.mode==='Espèces' ? '530000' : ix().cpt.get(v.compteId).compteCompta;
      D.ecritures.unshift({id:newId('EC'),num:nextNum(D.ecritures,'num',(v.mode==='Espèces'?'CAI':'BQ')+'-'),date:v.date,journal:v.mode==='Espèces'?'CAI':'BQ',libelle:`Règlement ${r.num} (${v.mode})`,circuit:f.circuit,lignes:[[acc,m,0],['411000',0,m]],origine:'Créances',reference:r.num,statut:'Brouillard'});
      save(); toast(`Règlement de ${da(m)} rapproché avec ${f.num}${v.mode==='Chèque'?' · chèque ajouté au portefeuille':''}`); render();
    }});
}
function renderAging(el){
  const rows = S.clients().map(c => { const o = {id:c.id,c,nonEchu:0,b30:0,b60:0,b90:0,b90p:0}; D.factures.filter(f=>f.clientId===c.id&&facReste(f)>0).forEach(f => { const j = joursRetard(f), r = facReste(f); if (j<=0) o.nonEchu+=r; else if (j<=30) o.b30+=r; else if (j<=60) o.b60+=r; else if (j<=90) o.b90+=r; else o.b90p+=r; }); o.total = o.nonEchu+o.b30+o.b60+o.b90+o.b90p; return o; }).filter(o=>o.total>0);
  el.innerHTML = `<div class="panel" style="margin-bottom:14px"><div class="panel-h"><h3>Répartition de l’encours par ancienneté</h3><span class="sub">Priorisez les recouvrements sur les tranches les plus anciennes</span></div><div class="chart-box sm"><canvas id="cAg2" role="img" aria-label="Balance âgée"></canvas></div></div><div id="agT"></div>`;
  const tot = k => sum(rows,r=>r[k]);
  chart('cAg2',{type:'bar',indexAxis:'y',data:{labels:['Non échu','1–30 jours','31–60 jours','61–90 jours','Plus de 90 jours'],datasets:[{data:['nonEchu','b30','b60','b90','b90p'].map(tot),backgroundColor:[SER()[0],SER()[3],SER()[3],SER()[1],SER()[1]],borderRadius:4,maxBarThickness:22}]}});
  renderTable(document.getElementById('agT'), {id:'aging', noun:'les clients', rows:()=>rows, onRow:r=>openClient(r.c), facets:['type'],
    columns:[{key:'client',label:'Client',get:r=>r.c.raison,strong:true},{key:'type',label:'Type',type:'enum',pill:false,get:r=>r.c.type},{key:'commercial',label:'Commercial',type:'enum',pill:false,get:r=>empName(r.c.commercialId),hidden:true},{key:'nonEchu',label:'Non échu',type:'money',sum:true},{key:'b30',label:'1–30 j',type:'money',sum:true},{key:'b60',label:'31–60 j',type:'money',sum:true},{key:'b90',label:'61–90 j',type:'money',sum:true},{key:'b90p',label:'> 90 j',type:'money',sum:true,render:r=>r.b90p?`<b style="color:var(--bad)">${da(r.b90p)}</b>`:'<span class="muted">—</span>'},{key:'total',label:'Total',type:'money',sum:true,strong:true}],
    presets:[{name:'Créances > 90 jours',rules:[{key:'b90p',op:'gt',v:'0',v2:''}]},{name:'Encours > 1 M DA',rules:[{key:'total',op:'gt',v:'1000000',v2:''}]}]});
}
function renderRelances(el){
  el.innerHTML = `<div class="callout" style="margin-bottom:14px;align-items:center;flex-wrap:wrap"><div style="flex:1;min-width:240px"><b>Règles de relance automatique</b><div class="muted" style="font-size:12.5px">Niveau 1 par e-mail à J+3 après l’échéance, niveau 2 par SMS et e-mail à J+30, niveau 3 par courrier recommandé à J+60.</div></div><button class="btn primary" id="runRel">${ic('play')} Lancer les relances du jour</button></div><div id="relT"></div>`;
  document.getElementById('runRel').onclick = () => {
    let n = 0;
    S.factures().filter(f=>facReste(f)>0&&f.echeance<TODAY).forEach(f => { const j = joursRetard(f); const lvl = j>=60?3:j>=30?2:j>=3?1:0; const done = D.relances.filter(r=>r.factureId===f.id).reduce((m,r)=>Math.max(m,r.niveau),0); if (lvl>done) { D.relances.unshift({id:newId('RL'),date:TODAY,factureId:f.id,clientId:f.clientId,niveau:lvl,canal:['','Email','SMS + Email','Courrier recommandé'][lvl],statut:'Envoyée',montant:facReste(f)}); n++; } });
    save(); toast(n ? `${n} relance${n>1?'s':''} générée${n>1?'s':''}` : 'Toutes les relances sont à jour'); render();
  };
  renderTable(document.getElementById('relT'), {id:'relances', noun:'les relances', rows:S.relances, onRow:r=>openFacture(ix().fac.get(r.factureId)), facets:['niveau','canal'],
    columns:[{key:'date',label:'Date',type:'date'},{key:'client',label:'Client',get:r=>cli(r.clientId).raison,strong:true},{key:'facture',label:'Facture',get:r=>ix().fac.get(r.factureId)?.num,render:r=>`<span class="mono">${ix().fac.get(r.factureId)?.num}</span>`},{key:'niveau',label:'Niveau',type:'enum',get:r=>'Niveau '+r.niveau,render:r=>pill('Niveau '+r.niveau,['','info','warn','bad'][r.niveau])},{key:'canal',label:'Canal',type:'enum',pill:false},{key:'montant',label:'Montant relancé',type:'money'},{key:'statut',label:'Statut',type:'enum'}]});
}

function forecast(weeks=13){
  const start = tresoDispo(); const out = []; let bal = start;
  const masse = sum(D.employes.filter(e=>e.statut==='Actif'),e=>e.salaire);
  for (let w=0; w<weeks; w++){
    const a = addDays(TODAY, w*7), b = addDays(TODAY, w*7+6);
    const inR = (d) => d>=a && d<=b || (w===0 && d<a);
    let enc = 0, dec = 0;
    D.factures.filter(f=>facReste(f)>0).forEach(f => { if (f.echeances.length) echAlloc(f).forEach(e => { if (e.montant>e.paye && inR(e.date) && e.date>=addDays(TODAY,-90)) enc += (e.montant-e.paye)*(e.date<TODAY?.5:.9); }); else if (inR(f.echeance) && f.echeance>=addDays(TODAY,-90)) enc += facReste(f)*(f.echeance<TODAY?.5:.9); });
    D.cheques.filter(c=>c.sens==='Reçu'&&['En portefeuille','Remis à l’encaissement'].includes(c.statut)&&inR(c.dateEcheance)).forEach(c=>enc+=c.montant);
    D.achats.filter(x=>x.statut==='Livrée'&&achatReste(x)>0&&inR(x.echeance)).forEach(x=>dec+=achatReste(x));
    D.achats.filter(x=>x.statut!=='Livrée'&&inR(addDays(x.dateLivraisonPrevue, frs(x.fournisseurId).delaiPaiement))).forEach(x=>dec+=x.ttc);
    D.cheques.filter(c=>c.sens==='Émis'&&c.statut==='Émis'&&inR(c.dateEcheance)).forEach(c=>dec+=c.montant);
    for (let d=0; d<7; d++){ const day = addDays(a,d); const dd = +day.slice(8); if (dd===25) dec += masse*.91; if (dd===20) dec += masse*.26 + 650000; if (dd===10) dec += 1600000; }
    bal += enc - dec; out.push({semaine:`S${w+1}`, debut:a, fin:b, enc:Math.round(enc), dec:Math.round(dec), solde:Math.round(bal)});
  }
  return {start, out};
}

      + `<div class="field"><label for="tkMsg">Ajouter une note</label><textarea class="inp" id="tkMsg" rows="2" placeholder="Diagnostic, action menée, échange avec le client…"></textarea></div>`,
    foot:`<button class="btn" data-msg style="margin-right:auto">Ajouter la note</button>${nexts.map(s=>`<button class="btn primary" data-st="${s}">${s==='En cours'?'Prendre en charge':s==='Résolu'?'Marquer résolu':'Clôturer'}</button>`).join('')}`,

      d.querySelector('[data-msg]').onclick = () => { const m = d.querySelector('#tkMsg').value.trim(); if (!m) { d.querySelector('#tkMsg').focus(); return; } t.historique.push({date:TODAY,auteur:PROFILES[UI.profile].label,msg:m}); save(); openTicket(t); };
